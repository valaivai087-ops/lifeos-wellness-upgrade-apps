        DATA['emotion_entropy.docx'] = JSON.parse(`{"name": "情緒熵與能量", "items": [{"type": "text", "content": "情緒混亂源頭系統"}, {"type": "text", "content": "Emotion Entropy Sources"}, {"type": "text", "content": "10層診斷地圖 × 100個源頭 × 低熵更新策略"}, {"type": "text", "content": "情緒混亂 ＝ 高刺激 ＋ 高壓力 ＋ 低恢復 ＋ 錯誤敘事 ＋ 長期內耗"}, {"type": "text", "content": "PART A"}, {"type": "text", "content": "精裝工具書"}, {"type": "text", "content": "10層情緒熵增源頭 × 神經機制 × 低熵策略"}, {"type": "text", "content": "情緒不是性格問題，情緒是系統問題。這10個層次——從最底層的生理狀態，到最深層的存在感——每一層都有它的熵增源頭，每一層都有它的更新入口。"}, {"type": "text", "content": "大多數人只在「情緒層」修補情緒，但真正的問題往往在其他層次：睡眠不足讓神經系統失穩，注意力碎裂讓思維無法收斂，低維語言把模型鎖死，身份固化讓改變失去方向。"}, {"type": "text", "content": "10層情緒熵增源頭總覽"}, {"type": "text", "content": "⚡  Layer 1  /  Physical Layer"}, {"type": "text", "content": "生理層"}, {"type": "text", "content": "身體高熵化"}, {"type": "text", "content": "身體是所有情緒的物理基礎。神經系統的穩定性，直接由生理狀態決定。身體高熵化，等於把所有其他努力建在沙上。"}, {"type": "text", "content": "🧠  Layer 2  /  Neural Layer"}, {"type": "text", "content": "神經層"}, {"type": "text", "content": "高警報系統"}, {"type": "text", "content": "杏仁核劫持是所有情緒失控的神經機制。當交感神經持續過強，前額葉的理性控制就會下線，情緒自動化接管。"}, {"type": "text", "content": "👁  Layer 3  /  Attention Layer"}, {"type": "text", "content": "注意力層"}, {"type": "text", "content": "注意力熵增"}, {"type": "text", "content": "注意力是最貴的生命資源。當注意力持續碎裂，不只工作效率下降，情緒穩定性也會跟著崩潰——因為大腦無法完成一個完整的思考循環。"}, {"type": "text", "content": "❤  Layer 4  /  Emotion Layer"}, {"type": "text", "content": "情緒層"}, {"type": "text", "content": "情緒失衡"}, {"type": "text", "content": "情緒本身不是問題，情緒失去流動才是。壓抑讓情緒在神經系統裡積累，爆炸讓它損傷關係，重播讓它消耗能量。真正的情緒管理，是讓情緒能安全流動。"}, {"type": "text", "content": "💡  Layer 5  /  Cognitive Layer"}, {"type": "text", "content": "認知層"}, {"type": "text", "content": "錯誤思維模型"}, {"type": "text", "content": "思維模型決定情緒的品質。災難化思考讓小事變大事，絕對化思考讓灰色地帶消失，讀心術思維讓誤會不斷產生。這些都是可以被辨識和更新的模型。"}, {"type": "text", "content": "💬  Layer 6  /  Language Layer"}, {"type": "text", "content": "語言層"}, {"type": "text", "content": "低維敘事"}, {"type": "text", "content": "語言是神經系統的OS。你反覆說的話，會被大腦當成指令執行，形成神經迴路，最終影響情緒、決策和行動。低維語言不只描述現實，更在創造現實。"}, {"type": "text", "content": "🔑  Layer 7  /  Identity Layer"}, {"type": "text", "content": "身份層"}, {"type": "text", "content": "固定人格"}, {"type": "text", "content": "身份認同是最底層的預測模型。「我就是這種人」這句話，比任何外部限制都更有力——它直接關閉了改變的可能性，讓大腦停止搜索新的選項。"}, {"type": "text", "content": "🤝  Layer 8  /  Relationship Layer"}, {"type": "text", "content": "關係層"}, {"type": "text", "content": "高耗能關係"}, {"type": "text", "content": "你長期耦合的關係場域，正在每天重塑你的神經系統。長期被否定的環境，會讓杏仁核持續過度活化；長期缺乏安全感的關係，會讓神經系統無法進入恢復狀態。"}, {"type": "text", "content": "🌿  Layer 9  /  Environment Layer"}, {"type": "text", "content": "環境層"}, {"type": "text", "content": "高熵環境"}, {"type": "text", "content": "環境不是背景，環境是持續運行的輸入系統。混亂的空間讓大腦持續在背景處理訊息，長期高刺激的環境讓神經系統無法進入恢復模式，節律混亂直接破壞生理時鐘。"}, {"type": "text", "content": "🌀  Layer 10  /  Existential Layer"}, {"type": "text", "content": "存在層"}, {"type": "text", "content": "深層失衡"}, {"type": "text", "content": "存在層的失衡是最深層的情緒混亂源頭。當一個人找不到意義、感覺失控、害怕沒有價值，所有其他層次的努力都會像在漏桶裡加水。"}, {"type": "text", "content": "最終核心"}, {"type": "text", "content": "PART B"}, {"type": "text", "content": "診斷與練習手冊"}, {"type": "text", "content": "自我診斷 × 頻率×嚴重度 × 深度反思"}, {"type": "text", "content": "這本手冊的使用方式：先完整做一次10層診斷表，找出你目前最高熵的3個層次。然後針對這3個層次，各完成一次深度反思，寫出具體的更新計畫。"}, {"type": "text", "content": "⚡  診斷手冊  Layer 1"}, {"type": "text", "content": "① 自我診斷表"}, {"type": "text", "content": "勾選頻率（○常 ○偶 ○無）和嚴重度（○高 ○中 ○低），並在右欄填寫你的具體觀察。"}, {"type": "text", "content": "② 深度反思"}, {"type": "text", "content": "針對這一層，誠實回答以下4個問題。每個問題至少寫3句話。"}, {"type": "text", "content": "🧠  診斷手冊  Layer 2"}, {"type": "text", "content": "👁  診斷手冊  Layer 3"}, {"type": "text", "content": "❤  診斷手冊  Layer 4"}, {"type": "text", "content": "💡  診斷手冊  Layer 5"}, {"type": "text", "content": "💬  診斷手冊  Layer 6"}, {"type": "text", "content": "🔑  診斷手冊  Layer 7"}, {"type": "text", "content": "🤝  診斷手冊  Layer 8"}, {"type": "text", "content": "🌿  診斷手冊  Layer 9"}, {"type": "text", "content": "🌀  診斷手冊  Layer 10"}, {"type": "text", "content": "後記：從診斷開始，而不是從努力開始"}, {"type": "text", "content": "很多人在情緒混亂時，直接跳到「我要更努力」「我要更自律」。但如果不知道混亂的源頭在哪一層，努力只是在高熵系統裡加速消耗。"}, {"type": "text", "content": "這10個層次，是讓你看清楚自己的情緒系統裡，哪裡在漏能、哪裡在堵塞、哪裡需要更新。診斷清楚了，更新才能真正落地。"}, {"type": "text", "content": "—— 願你的10個層次，都越來越低熵；願你的情緒，都能安全流動。"}, {"type": "text", "content": "PART A ｜精裝工具書"}, {"type": "text", "content": "10層總覽 × 各層10大源頭×機制×策略詳解"}, {"type": "text", "content": "━━━"}, {"type": "text", "content": "PART B ｜診斷與練習手冊"}, {"type": "text", "content": "各層自我診斷表 × 每層反思深化"}, {"type": "table", "rows": [["PART A ｜精裝工具書"], ["10層總覽 × 各層10大源頭×機制×策略詳解"], ["━━━"], ["PART B ｜診斷與練習手冊"], ["各層自我診斷表 × 每層反思深化"]]}, {"type": "text", "content": "圖示 層級"}, {"type": "text", "content": "10大源頭（摘要）"}, {"type": "text", "content": "神經/心理機制"}, {"type": "text", "content": "核心洞察"}, {"type": "text", "content": "⚡ 生理層"}, {"type": "text", "content": "Physical Layer"}, {"type": "text", "content": "睡眠不足｜熬夜｜慢性疲勞｜血糖震盪｜高糖飲食…"}, {"type": "text", "content": "神經耗能→情緒調節崩潰"}, {"type": "text", "content": "身體不穩定，情緒就沒有地基。"}, {"type": "text", "content": "🧠 神經層"}, {"type": "text", "content": "Neural Layer"}, {"type": "text", "content": "交感神經過強｜杏仁核過度活化｜前額葉下線｜長期高警報｜情緒耐受下降…"}, {"type": "text", "content": "杏仁核劫持→前額葉失能"}, {"type": "text", "content": "呼吸是唯一能直接影響自律神經的工具。"}, {"type": "text", "content": "👁 注意力層"}, {"type": "text", "content": "Attention Layer"}, {"type": "text", "content": "短影音成癮｜手機依賴｜資訊爆炸｜注意力碎裂｜多工處理…"}, {"type": "text", "content": "注意力碎裂→情緒共振中斷"}, {"type": "text", "content": "注意力放哪，情緒能量就流向哪。"}, {"type": "text", "content": "❤ 情緒層"}, {"type": "text", "content": "Emotion Layer"}, {"type": "text", "content": "情緒壓抑｜情緒爆炸｜情緒重播｜過度內耗｜情緒辨識低…"}, {"type": "text", "content": "情緒壓抑→高警報循環"}, {"type": "text", "content": "情緒是訊號，不是身份。"}, {"type": "text", "content": "💡 認知層"}, {"type": "text", "content": "Cognitive Layer"}, {"type": "text", "content": "災難化思考｜絕對化思考｜敵我化思考｜受害者思維｜完美主義…"}, {"type": "text", "content": "災難化→焦慮自我實現"}, {"type": "text", "content": "想法不是事實，只是當下的模型。"}, {"type": "text", "content": "💬 語言層"}, {"type": "text", "content": "Language Layer"}, {"type": "text", "content": "我很爛｜我沒救了｜人生完了｜都是別人害的｜我永遠改不了…"}, {"type": "text", "content": "語言迴路→情緒預測固化"}, {"type": "text", "content": "語言不是表達工具，語言是人格生成器。"}, {"type": "text", "content": "🔑 身份層"}, {"type": "text", "content": "Identity Layer"}, {"type": "text", "content": "我就是這種人｜我天生如此｜固定型人格｜低自我價值｜身份羞辱化…"}, {"type": "text", "content": "身份固化→行為空間縮小"}, {"type": "text", "content": "身份不是固定的，身份是長期收斂的行為結果。"}, {"type": "text", "content": "🤝 關係層"}, {"type": "text", "content": "Relationship Layer"}, {"type": "text", "content": "長期被否定｜高衝突環境｜缺乏支持｜情緒勒索｜邊界崩壞…"}, {"type": "text", "content": "安全感崩潰→神經高警報"}, {"type": "text", "content": "關係是能量交換系統，不是情緒垃圾桶。"}, {"type": "text", "content": "🌿 環境層"}, {"type": "text", "content": "Environment Layer"}, {"type": "text", "content": "環境太亂｜資訊噪音｜高刺激場域｜長期壓力場｜沒有休息空間…"}, {"type": "text", "content": "環境輸入→人格持續重塑"}, {"type": "text", "content": "你設計環境，環境塑造你。"}, {"type": "text", "content": "🌀 存在層"}, {"type": "text", "content": "Existential Layer"}, {"type": "text", "content": "缺乏意義感｜沒有方向感｜長期失控感｜未來感崩塌｜存在焦慮…"}, {"type": "text", "content": "意義崩壞→動力系統失能"}, {"type": "text", "content": "意義感不是找到的，是在行動中建構的。"}, {"type": "table", "rows": [["層", "圖示 層級", "英文", "10大源頭（摘要）", "神經/心理機制", "核心洞察"], ["1", "⚡ 生理層", "Physical Layer", "睡眠不足｜熬夜｜慢性疲勞｜血糖震盪｜高糖飲食…", "神經耗能→情緒調節崩潰", "身體不穩定，情緒就沒有地基。"], ["2", "🧠 神經層", "Neural Layer", "交感神經過強｜杏仁核過度活化｜前額葉下線｜長期高警報｜情緒耐受下降…", "杏仁核劫持→前額葉失能", "呼吸是唯一能直接影響自律神經的工具。"], ["3", "👁 注意力層", "Attention Layer", "短影音成癮｜手機依賴｜資訊爆炸｜注意力碎裂｜多工處理…", "注意力碎裂→情緒共振中斷", "注意力放哪，情緒能量就流向哪。"], ["4", "❤ 情緒層", "Emotion Layer", "情緒壓抑｜情緒爆炸｜情緒重播｜過度內耗｜情緒辨識低…", "情緒壓抑→高警報循環", "情緒是訊號，不是身份。"], ["5", "💡 認知層", "Cognitive Layer", "災難化思考｜絕對化思考｜敵我化思考｜受害者思維｜完美主義…", "災難化→焦慮自我實現", "想法不是事實，只是當下的模型。"], ["6", "💬 語言層", "Language Layer", "我很爛｜我沒救了｜人生完了｜都是別人害的｜我永遠改不了…", "語言迴路→情緒預測固化", "語言不是表達工具，語言是人格生成器。"], ["7", "🔑 身份層", "Identity Layer", "我就是這種人｜我天生如此｜固定型人格｜低自我價值｜身份羞辱化…", "身份固化→行為空間縮小", "身份不是固定的，身份是長期收斂的行為結果。 , ["2  手機依賴", "7  噪音過多"], ["3  資訊爆炸", "8  社群媒體過量"], ["4  注意力碎裂", "9  無法深度專注"], ["5  多工處理", "10  認知負載過高"]]}, {"type": "text", "content": "短影音→多巴胺快速循環→注意力閾值升高→對緩慢事物失去耐心；認知負載過高→工作記憶超載→決策品質下降→錯誤累積→挫折感升高。"}, {"type": "text", "content": "1. 番茄鐘（25分鐘深度工作+5分鐘休息） 2. 手機移出工作區或關閉通知 3. 每天設定1個無手機時段（建議早晨） 4. 減少社群媒體至每天30分鐘以內 5. 建立單一任務原則 6. 每週設計1次深度工作半天"}, {"type": "table", "rows": [["⚙ 神經/心理機制", "✅ 低熵更新策略"], ["短影音→多巴胺快速循環→注意力閾值升高→對緩慢事物失去耐心；認知負載過高→工作記憶超載→決策品質下降→錯誤累積→挫折感升高。", "1. 番茄鐘（25分鐘深度工作+5分鐘休息） 2. 手機移出工作區或關閉通知 3. 每天設定1個無手機時段（建議早晨） 4. 減少社群媒體至每天30分鐘以內 5. 建立單一任務原則 6. 每週設計1次深度工作半天"]]}, {"type": "table", "rows": [["情緒是訊號，不是身份。"]]}, {"type": "text", "content": "❤ 情緒層 的10大熵增源頭"}, {"type": "text", "content": "1  情緒壓抑"}, {"type": "text", "content": "6  羞恥感過高"}, {"type": "text", "content": "2  情緒爆炸"}, {"type": "text", "content": "7  委屈累積"}, {"type": "text", "content": "3  情緒重播"}, {"type": "text", "content": "8  情緒人格接管"}, {"type": "text", "content": "4  過度內耗"}, {"type": "text", "content": "9  觀察者消失"}, {"type": "text", "content": "5  情緒辨識低"}, {"type": "text", "content": "10  長期焦慮化"}, {"type": "table", "rows": [["❤ 情緒層 的10大熵增源頭", "（每一項都是神經系統的「漏能點」）"], ["1  情緒壓抑", "6  羞恥感過高"], ["2  情緒爆炸", "7  委屈累積"], ["3  情緒重播", "8  情緒人格接管"], ["4  過度內耗", "9  觀察者消失"], ["5  情緒辨識低", "10  長期焦慮化"]]}, {"type": "text", "content": "情緒壓抑→皮質醇長期高位→免疫系統受損；情緒重播→杏仁核反覆激活→創傷固化；觀察者消失→人格自動化→喪失選擇能力。"}, {"type": "text", "content": "1. 情緒命名（「我現在在焦慮」而非「我很焦慮」） 2. 記錄情緒觸發點日記（5分鐘/天） 3. 分離事件與情緒：事情是A，我的解讀是B，情緒是C 4. 建立情緒停頓空間（情緒升高時先暫停3秒） 5. 允許情緒流動（哭泣、書寫、運動） 6. 每天問：今天有什麼情緒沒被看見？"}, {"type": "table", "rows": [["⚙ 神經/心理機制", "✅ 低熵更新策略"], ["情緒壓抑→皮質醇長期高位→免疫系統受損；情緒重播→杏仁核反覆激活→創傷固化；觀察者消失→人格自動化→喪失選擇能力。", "1. 情緒命名（「我現在在焦慮」而非「我很焦慮」） 2. 記錄情緒觸發點日記（5分鐘/天） 3. 分離事件與情緒：事情是A，我的解讀是B，情緒是C 4. 建立情緒停頓空間（情緒升高時先暫停3秒） 5. 允許情緒流動（哭泣、書寫、運動） 6. 每天問：今天有什麼情緒沒被看見？"]]}, {"type": "table", "rows": [["想法不是事實，只是當下的模型。"]]}, {"type": "text", "content": "💡 認知層 的10大熵增源頭"}, {"type": "text", "content": "1  災難化思考"}, {"type": "text", "content": "6  過度腦補"}, {"type": "text", "content": "2  絕對化思考"}, {"type": "text", "content": "7  過度比較"}, {"type": "text", "content": "3  敵我化思考"}, {"type": "text", "content": "8  讀心術思維"}, {"type": "text", "content": "4  受害者思維"}, {"type": "text", "content": "9  自我否定"}, {"type": "text", "content": "5  完美主義"}, {"type": "text", "content": "10  負面預測循環"}, {"type": "table", "rows": [["💡 認知層 的10大熵增源頭", "（每一項都是神經系統的「漏能點」）"], ["1  災難化思考", "6  過度腦補"], ["2  絕對化思考", "7  過度比較"], ["3  敵我化思考", "8  讀心術思維"], ["4  受害者思維", "9  自我否定"], ["5  完美主義", "10  負面預測循環"]]}, {"type": "text", "content": "災難化→杏仁核持續高警報；絕對化→解決問題空間縮小→無助感；讀心術思維→把自己的解讀當作對方意圖→關係誤解循環。"}, {"type": "text", "content": "1. 辨識思維模型：「我現在在災難化嗎？」 2. 練習概率語言：不說「一定」，說「有可能」 3. 多角度思考：這件事還有什麼其他解釋？ 4. 停止比較：每人賽道不同，比較消耗注意力 5. 每天寫1個「我今天腦補了什麼」 6. 建立誤差而非失敗的框架"}, {"type": "table", "rows": [["⚙ 神經/心理機制", "✅ 低熵更新策略"], ["災難化→杏仁核持續高警報；絕對化→解決問題空間縮小→無助感；讀心術思維→把自己的解讀當作對方意圖→關係誤解循環。", "1. 辨識思維模型：「我現在在災難化嗎？」 2. 練習概率語言：不說「一定」，說「有可能」 3. 多角度思考：這件事還有什麼其他解釋？ 4. 停止比較：每人賽道不同，比較消耗注意力 5. 每天寫1個「我今天腦補了什麼」 6. 建立誤差而非失敗的框架"]]}, {"type": "table", "rows": [["語言不是表達工具，語言是人格生成器。"]]}, {"type": "text", "content": "💬 語言層 的10大熵增源頭"}, {"type": "text", "content": "1  我很爛"}, {"type": "text", "content": "6  我一定失敗"}, {"type": "text", "content": "2  我沒救了"}, {"type": "text", "content": "7  我很亂"}, {"type": "text", "content": "3  人生完了"}, {"type": "text", "content": "8  沒人懂我"}, {"type": "text", "content": "4  都是別人害的"}, {"type": "text", "content": "9  我很廢"}, {"type": "text", "content": "5  我永遠改不了"}, {"type": "text", "content": "10  負面自我對話"}, {"type": "table", "rows": [["💬 語言層 的10大熵增源頭", "（每一項都是神經系統的「漏能點」）"], ["1  我很爛", "6  我一定失敗"], ["2  我沒救了", "7  我很亂"], ["3  人生完了", "8  沒人懂我"], ["4  都是別人害的", "9  我很廢"], ["5  我永遠改不了", "10  負面自我對話"]]}, {"type": "text", "content": "負面自我對話→降低自我效能感→迴避行為→更多失敗→更多負面對話；語言框架→情緒框架→行動可能性；大腦用語言預測未來，低維語言讓預測系統陷入負迴圈。"}, {"type": "text", "content": "1. 把「我很爛」→「這個策略待優化」 2. 把「沒救了」→「模型需要更新」 3. 把「完了」→「系統在重組」 4. 把「永遠改不了」→「神經具有可塑性」 5. 每天替換3句低維語言 6. 用「正在」語法：「我正在練習…」"}, {"type": "table", "rows": [["⚙ 神經/心理機制", "✅ 低熵更新策略"], ["負面自我對話 統的「漏能點」）"], ["1  長期被否定", "6  討好人格"], ["2  高衝突環境", "7  缺乏安全感"], ["3  缺乏支持", "8  孤單感"], ["4  情緒勒索", "9  關係內耗"], ["5  邊界崩壞", "10  情感失衡"]]}, {"type": "text", "content": "情緒勒索→邊界崩壞→能量外流→恢復不足→更多情緒失衡；討好人格→壓抑真實需求→委屈累積→爆炸；孤單感→缺乏社會支持→壓力荷爾蒙升高。"}, {"type": "text", "content": "1. 辨識高耗能關係：這段關係讓我更有能量還是更沒能量？ 2. 練習說「不」：先從小事開始 3. 建立情緒邊界：你的情緒是你的，我可以陪伴但不是責任 4. 靠近高品質圈層：能量會傳染 5. 降低低品質互動的時間與頻率 6. 建立自我支持系統：不把情緒完全外包"}, {"type": "table", "rows": [["⚙ 神經/心理機制", "✅ 低熵更新策略"], ["情緒勒索→邊界崩壞→能量外流→恢復不足→更多情緒失衡；討好人格→壓抑真實需求→委屈累積→爆炸；孤單感→缺乏社會支持→壓力荷爾蒙升高。", "1. 辨識高耗能關係：這段關係讓我更有能量還是更沒能量？ 2. 練習說「不」：先從小事開始 3. 建立情緒邊界：你的情緒是你的，我可以陪伴但不是責任 4. 靠近高品質圈層：能量會傳染 5. 降低低品質互動的時間與頻率 6. 建立自我支持系統：不把情緒完全外包"]]}, {"type": "table", "rows": [["你設計環境，環境塑造你。"]]}, {"type": "text", "content": "🌿 環境層 的10大熵增源頭"}, {"type": "text", "content": "1  環境太亂"}, {"type": "text", "content": "6  高競爭環境"}, {"type": "text", "content": "2  資訊噪音"}, {"type": "text", "content": "7  缺少穩定感"}, {"type": "text", "content": "3  高刺激場域"}, {"type": "text", "content": "8  生活失序"}, {"type": "text", "content": "4  長期壓力場"}, {"type": "text", "content": "9  節律混亂"}, {"type": "text", "content": "5  沒有休息空間"}, {"type": "text", "content": "10  恢復環境不足"}, {"type": "table", "rows": [["🌿 環境層 的10大熵增源頭", "（每一項都是神經系統的「漏能點」）"], ["1  環境太亂", "6  高競爭環境"], ["2  資訊噪音", "7  缺少穩定感"], ["3  高刺激場域", "8  生活失序"], ["4  長期壓力場", "9  節律混亂"], ["5  沒有休息空間", "10  恢復環境不足"]]}, {"type": "text", "content": "雜亂環境→認知負載持續高位→決策疲勞；資訊噪音→注意力持續切換→無法深度思考；節律混亂→皮質醇分泌失衡→情緒調節能力下降。"}, {"type": "text", "content": "1. 每天花10分鐘整理物理空間 2. 建立深度工作區（專門用於專注的空間） 3. 設計低刺激恢復區（睡前1小時無螢幕） 4. 降低環境噪音（降噪耳機或白噪音） 5. 建立固定日常節律（起床、睡眠、工作時間） 6. 清理資訊環境：退出低品質群組，限制資訊來源"}, {"type": "table", "rows": [["⚙ 神經/心理機制", "✅ 低熵更新策略"], ["雜亂環境→認知負載持續高位→決策疲勞；資訊噪音→注意力持續切換→無法深度思考；節律混亂→皮質醇分泌失衡→情緒調節能力下降。", "1. 每天花10分鐘整理物理空間 2. 建立深度工作區（專門用於專注的空間） 3. 設計低刺激恢復區（睡前1小時無螢幕） 4. 降低環境噪音（降噪耳機或白噪音） 5. 建立固定日常節律（起床、睡眠、工作時間） 6. 清理資訊環境：退出低品質群組，限制資訊來源"]]}, {"type": "table", "rows": [["意義感不是找到的，是在行動中建構的。"]]}, {"type": "text", "content": "🌀 存在層 的10大熵增源頭"}, {"type": "text", "content": [["🔥 最終核心"], ["情緒混亂不是性格問題"], ["是系統問題"], ["從最高熵的層次開始"], ["一次一層，逐步降熵"], ["真正的改變："], ["不是靠意志力撐"], ["而是靠系統更新"], ["🔥 你不是壞掉了。是系統需要更新。"]]}]}`);
        DATA['emotion_language.docx'] = JSON.parse(`{"name": "情緒語言系統", "items": [{"type": "text", "content": "情緒的語言"}, {"type": "text", "content": "The Language of Emotion"}, {"type": "text", "content": "從情緒反應，到情緒承載"}, {"type": "text", "content": "理解情緒的本質，重寫神經系統，找回真正的成熟"}, {"type": "text", "content": "情緒不是敵人。情緒是大腦的誤差訊號。"}, {"type": "text", "content": "序言"}, {"type": "text", "content": "你有過這種感覺嗎？"}, {"type": "text", "content": "事情明明已經過去了，但情緒卻還在。某句話、某個眼神、某次失敗，過了很多年仍然會突然浮現，讓你的心再次沉下去。"}, {"type": "text", "content": "很多人因此懷疑自己：是不是太敏感？是不是太脆弱？是不是放不下？"}, {"type": "text", "content": "但真正發生的，其實不是你有問題。而是：你的系統，還沒有完成更新。"}, {"type": "text", "content": "這本書試圖做一件事：幫你重新認識情緒。不是告訴你「要正向思考」，也不是教你「壓住情緒」——而是從神經科學的角度，告訴你情緒到底是什麼，它為什麼會反覆重播，又如何才能真正更新。"}, {"type": "text", "content": "每一章都圍繞一個核心問題，從現象出發，到機制分析，到語法更新，到行動練習。讀完之後，你不會變成一個沒有情緒的人——你會成為一個能承載情緒的人。"}, {"type": "text", "content": "那才是真正的成熟。"}, {"type": "text", "content": "第 一 章"}, {"type": "text", "content": "情緒反覆重播的真相"}, {"type": "text", "content": "情緒不是敵人，而是大腦的誤差訊號"}, {"type": "text", "content": "很多人都有過這種經驗。事情明明過去了，但情緒卻還留著。一句話，別人可能早忘了，你卻記很多年。某次失敗，明明已經結束，卻還是會突然想起來。某段關係，明明離開了，深夜卻仍然會反覆重播。"}, {"type": "text", "content": "很多人因此開始懷疑自己。是不是太敏感？是不是太脆弱？是不是放不下？"}, {"type": "text", "content": "§1  情緒，從來不是敵人"}, {"type": "text", "content": "大部分人從小被教導：不要哭，不要生氣，不要太敏感，不要情緒化。久而久之，很多人開始認為情緒是不好的。於是我們慢慢學會壓抑情緒、逃避情緒、否定情緒。表面上看起來沒事，但身體其實記得。"}, {"type": "text", "content": "那些沒被理解的情緒，不會真的消失。它們會轉成焦慮、疲勞、失眠、暴食、慢性內耗、專注力下降。很多人以為只是最近壓力太大，但其實更深的問題是：神經系統，長期處於高警戒狀態。"}, {"type": "text", "content": "§2  大腦，其實一直在預測世界"}, {"type": "text", "content": "從神經科學的角度來看，大腦每天都在做一件事：預測未來。它會不斷確認：我安全嗎？我會失敗嗎？我會被討厭嗎？我會被拋棄嗎？"}, {"type": "text", "content": "而當現實和大腦原本的預測不同時，大腦就會產生「誤差訊號」。這個誤差訊號，就是情緒。所以：焦慮，其實是對未來失控的預測；憤怒，其實是邊界被侵犯；悲傷，其實是重要連結流失；羞愧，其實是害怕失去認同。情緒背後，其實都有模型。"}, {"type": "text", "content": "§3  很多情緒，其實來自過去"}, {"type": "text", "content": "你會慢慢發現：現在很多情緒，其實都和過去有關。小時候如果常被否定，長大後別人一句批評，就可能讓你很痛。如果從小缺乏安全感，長大後就容易焦慮失控。如果以前總需要討好別人，長大後就很難拒絕別人。"}, {"type": "text", "content": "很多時候，你以為自己在面對現在，其實你是在重播過去。"}, {"type": "text", "content": "§4  真正的改變，從重新命名開始"}, {"type": "text", "content": "如果你想開始更新系統，第一步不是壓住情緒，而是：重新理解情緒。很多人只會說「我很煩」，但真正有效的方法是精準描述——例如：我害怕失敗、我害怕被否定、我害怕失去控制。"}, {"type": "text", "content": "研究發現：當人越能精準命名情緒，大腦警報系統越容易下降。因為模糊會增加混亂，清楚才能開始穩定。"}, {"type": "text", "content": "§5  情緒不是你"}, {"type": "text", "content": "第二個很重要的更新是：停止把情緒當成自己。不要再說「我很焦慮」，試著改成「我的系統正在產生焦慮訊號」。這看起來只是語言差異，但其實是在重新建立身份邊界——情緒不是你，情緒只是系統暫時的狀態。"}, {"type": "text", "content": "情緒從來不是來毀掉你的。情緒是來提醒你的——它在告訴你：有些地方需要被看見，有些模型需要被更新。真正的自由，不是永遠快樂，而是即使情緒來了，你仍然知道：你可以理解它、承載它、穿越它。"}, {"type": "text", "content": "第 二 章"}, {"type": "text", "content": "焦慮其實是預測失控"}, {"type": "text", "content": "真正耗能的，不是現實，而是大腦反覆模擬災難"}, {"type": "text", "content": "很多人都有這種感覺。明明沒有真正發生什麼事，但心裡卻一直很緊。總覺得好像會出事。睡前開始亂想，訊息沒回就開始焦慮，工作還沒開始壓力就先上來，還沒失敗腦袋已經開始預演崩潰。"}, {"type": "text", "content": "很多人會以為是自己抗壓性太差，或是想太多，或是心理有問題。但其實：焦慮從來不是軟弱，焦慮本質上是大腦的預測系統失控。"}, {"type": "text", "content": "①  問題現象層"}, {"type": "text", "content": "焦慮最可怕的地方，不是事情真的發生，而是「還沒發生，你就已經耗盡能量」。很多人每天都活在預測中的災難：還沒開會先焦慮、還沒考試先失眠、還沒被討厭先討好、還沒失敗先自我否定。於是系統開始出現拖延、內耗、失眠、疲勞、注意力下降、情緒暴躁、身體緊繃。"}, {"type": "text", "content": "②  錯誤語法層"}, {"type": "text", "content": "很多人的焦慮，其實是童年建立的。如果你從小容易被責怪、容易被否定、常被比較、經常缺乏安全感，大腦就會慢慢形成「世界不安全」的模型。於是系統開始過度監控，因為大腦認為：只要我預測更多危險，我就比較不會受傷。"}, {"type": "text", "content": "所以很多焦慮的人，其實不是愛亂想，而是系統長期處於生存模式。例如「我不能失敗」、「我一定要表現好」、「我不能讓人失望」——這些語法，會讓系統長期高耗能。"}, {"type": "text", "content": "③  系統機制層"}, {"type": "text", "content": "從神經科學角度，大腦本來就不是追求快樂，而是追求生存。所以大腦每天都在預測：危險在哪？風險在哪？失敗機率多少？別人會怎麼看我？正常情況下，預測系統可以幫助我們生存。但當一個人長期壓力過大，大腦就會開始「過度預測」。"}, {"type": "text", "content": "這時候杏仁核活性上升，壓力系統被啟動，神經系統進入高警戒模式。於是還沒發生的事，身體就先進入戰鬥狀態。這就是焦慮——焦慮真正的本質是：預測失控。"}, {"type": "text", "content": "④-⑤  誤差訊號與熵增崩潰層"}, {"type": "text", "content": "真正高維的人會知道：焦慮不是敵人，焦慮其實是系統提醒——它在告訴你，你的安全模型失衡了。例如過度害怕失敗、過度害怕被否定、過度想控制未來、過度依賴外界認可，這些都代表系統正在高耗能運作。"}, {"type": "text", "content": "如果長期焦慮而不更新，系統會開始全面熵增：失眠、腸胃問題、慢性疲勞、注意力崩潰、情緒不穩、免疫下降。因為大腦一直在模擬災難，就像一台電腦同時開了100個背景程式，最後一定過熱。"}, {"type": "text", "content": "⑥  更新機制層"}, {"type": "text", "content": "真正的更新，不是強迫自己不要焦慮，而是重新校準預測系統。第一步，停止災難化預測：「如果失敗，人生就完了」→「失敗只是資料更新」。第二步，把注意力拉回現在，因為焦慮本質上是活在還沒發生的未來。第三步，降低系統警戒——呼吸、睡眠、運動、規律節律、減少資訊轟炸。第四步，建立新的安全模型：「我不需要完美，也能被接受。我即使犯錯，仍然有價值。」"}, {"type": "text", "content": "第 三 章"}, {"type": "text", "content": "情緒如何綁架決策"}, {"type": "text", "content": "很多時候，你不是在做決策，而是在情緒逃生"}, {"type": "text", "content": "很多人以為自己的問題是不夠理性。但其實不是。真正的問題是：大腦在情緒高壓下，已經切換成「生存模式」。於是你以為你在思考，其實你只是在逃避痛苦。"}, {"type": "text", "content": "你一定有過這種經驗：明明知道不該衝動，卻還是情緒爆炸。明明知道不適合，卻還是離不開關係。明明知道要早睡，卻還是滑手機到半夜。明明知道該行動，卻一直拖延。很多人會以為自己自制力差，但其實：真正控制你的，不是理性，而是情緒。"}, {"type": "text", "content": "②③  錯誤語法與系統機制層"}, {"type": "text", "content": "從神經科學角度，大腦有兩套系統：生存系統和理性系統。當情緒壓力太高，大腦會優先啟動生存系統，因為對大腦來說：活下來，比理性重要。所以當情緒被觸發，前額葉功能會下降，杏仁核活性會上升。這時候大腦會開始短視化、衝動化、逃避化。"}, {"type": "text", "content": "所以：拖延，很多時候不是懶，而是大腦在逃避壓力。暴怒，很多時候不是脾氣差，而是系統進入防禦模式。討好，很多時候不是善良，而是害怕失去連結。很多決策，其實都是情緒保護機制。"}, {"type": "text", "content": "④⑤  誤差訊號與熵增層"}, {"type": "text", "content": "錯誤決策很多時候是情緒訊號，它代表系統失衡了。例如一直亂買東西是情緒補償、一直拖延是壓力逃避、一直進爛關係是依附缺口、一直熬夜是情緒麻痺。如果長期被情緒綁架，你會慢慢失去真正的選擇能力，人生開始變成情緒自動導航。"}, {"type": "text", "content": "真正的更新，不是壓住情緒，而是重新奪回系統控制權。第一步：延遲反應——情緒來時不要立刻決策，因為高情緒狀態下大腦會短視化。第二步：辨識情緒來源——我現在是真的想要，還是在逃避痛苦？第三步：把情緒和身份分離，不要說「我很爛」，改成「系統現在處於高壓狀態」。第四步：建立新的神經路徑，焦慮→拆解→行動，而不是焦慮→逃避。"}, {"type": "text", "content": "第 四 章"}, {"type": "text", "content": "情緒命名：大腦重寫的開始"}, {"type": "text", "content": "說得出來，才能改得了"}, {"type": "text", "content": "很多人會說「我情緒很多」，但如果你問他「你現在是什麼情緒」，他說不出來。他只能說：「就是不舒服。」「就是很煩。」「就是很糟。」"}, {"type": "text", "content": "但情緒的本質，是有結構的。每一種情緒，都有它背後的模型，有它試圖傳遞的訊號，有它想保護的部分。當你學會精準命名情緒，大腦的警報系統就會開始下降——因為模糊製造混亂，清晰帶來穩定。"}, {"type": "text", "content": "§1  為什麼命名很重要"}, {"type": "text", "content": "神經科學研究發現：當人能夠給情緒貼上精準的標籤，杏仁核的活性就會下降。這個過程叫做「情緒標記」（affect labeling）。它不是壓抑情緒，而是讓前額葉重新介入——你從「被情緒淹沒」的狀態，轉移到「觀察情緒」的狀態。"}, {"type": "text", "content": "這是情緒更新的第一步：能說出來的情緒，才有機會被處理。"}, {"type": "text", "content": "§2  從模糊到精準"}, {"type": "text", "content": "大多數人的情緒語言庫非常有限：「我很煩」、「我很悶」、「我心情不好」。但情緒的世界遠比這豐富：你說「煩」，其實可能是焦慮、委屈、憤怒、失落、羞愧——這幾種情緒，背後完全不同的系統訊號，對應完全不同的更新方向。"}, {"type": "text", "content": "把「我很煩」更新成「我很害怕這次失敗會讓別人失望我」，這不是在小題大做，而是在精準定位系統問題。定位準了，才能真正更新。"}, {"type": "text", "content": "§3  實戰：情緒命名的三層深度"}, {"type": "text", "content": "第一層：描述感受——「我現在感到不舒服。」第二層：辨識情緒——「我現在感到焦慮，有一種即將出事的緊張。」第三層：連結來源——「我現在焦慮，因為我害怕這個結果讓別人失望我，就像小時候考差被責罵那樣。」"}, {"type": "text", "content": "每深一層，系統就清晰一分。不需要每次都走到第三層，但練習越多，你的情緒理解能力就越強，神經系統也越穩定。"}, {"type": "text", "content": "第 五 章"}, {"type": "text", "content": "神經迴路與情緒記憶"}, {"type": "text", "content": "為什麼有些痛，過了很多年還在？"}, {"type": "text", "content": "很多人都有這種經驗。明明事情早就過去了，但某一句話、某個場景、某種眼神，仍然會瞬間刺痛你。甚至只是類似情境，身體就開始緊張。心跳加快、呼吸變淺、情緒失控。"}, {"type": "text", "content": "你以為：自己還放不下。但真正發生的是：神經迴路，還沒有更新。"}, {"type": "text", "content": "很多人會發現：自己總在重複同樣情緒。同樣焦慮，同樣害怕，同樣討好，同樣憤怒。即使換了人、換了工作、換了環境，情緒模式仍然一樣。甚至很多反應，快到你來不及思考——別人一皺眉你立刻緊張，別人冷淡你立刻焦慮，被否定你立刻崩潰。很多人以為個性就是這樣，但其實：那是神經迴路自動化。"}, {"type": "text", "content": "很多人從小建立的不是安全感，而是生存反應。例如：只要犯錯就被罵，只要情緒化就被否定，只要表現不好就失去認同。於是大腦開始建立情緒記憶：被否定＝危險、衝突＝失去愛、失敗＝沒有價值。"}, {"type": "text", "content": "從神經科學角度，大腦有一個特性：重複的路徑，會越來越強——這叫神經可塑性。你越常焦慮，焦慮路徑越強；你越常討好，討好迴路越穩定；你越常逃避，逃避系統越自動化。久了之後，情緒不需要思考就會直接啟動。這也是為什麼：知道道理，不等於神經重寫。"}, {"type": "text", "content": "真正的更新，不是強迫忘記，而是建立新的神經路徑。第一步：辨識觸發點——哪些人、哪些語氣、哪些情境，最容易觸發你？第二步：停止自動反應，因為覺察是重寫的開始。第三步：建立新回應，例如被否定→觀察＋調整，而不是被否定→崩潰。第四步：重複新的神經路徑，因為神經系統靠重複更新，不是靠理解更新。"}, {"type": "text", "content": "第 七 章"}, {"type": "text", "content": "真正成熟：被誤解時仍穩定"}, {"type": "text", "content": "成熟不是控制別人理解，而是建立內在穩定"}, {"type": "text", "content": "很多人真正崩潰的，不是事情本身，而是「不被理解」。一句誤會，就失眠。一次否定，就開始懷疑自己。別人一個眼神，就開始內耗。很多人表面上看起來成熟，但只要被誤解、被否定、被批評，系統立刻失控。因為：很多人的穩定，其實建立在「外界認可」，而不是真正的內在穩定。"}, {"type": "text", "content": "①②  問題現象與錯誤語法層"}, {"type": "text", "content": "很多人最怕的不是失敗，而是被誤解。因為一旦別人誤會自己，系統就開始焦慮、解釋、證明、討好、崩潰。很多人甚至會反覆重播對話，整天能量被抽乾。"}, {"type": "text", "content": "這背後的舊語法是：「我必須被認可，才有價值。」表現好才被愛，乖才被接受，成績好才值得肯定。久了之後，大腦形成「外界評價＝生存安全」的模型。所以只要被誤解，系統就自動判定：危險。"}, {"type": "text", "content": "從神經科學角度，人類大腦非常在意群體認同，因為遠古時代被群體排斥可能等於死亡。所以被誤解時，大腦會啟動威脅反應，杏仁核活化，壓力系統上升，前額葉開始下降。很多人開始情緒化、防禦化、討好化、解釋化。"}, {"type": "text", "content": "真正可怕的是：系統會把「別人的看法」當成「自己的價值」。這就是情緒綁架身份。"}, {"type": "text", "content": "真正成熟，不是讓所有人理解你，而是即使被誤解，仍然穩定。第一步：停止過度解釋。第二步：把身份與評價分離——別人否定我≠我沒價值。第三步：建立內在驗證系統，不只問「別人怎麼看我」，開始問「我有沒有對齊自己」。第四步：允許誤解存在，因為不是所有人都有能力理解你。"}, {"type": "text", "content": "第 八 章"}, {"type": "text", "content": "從情緒反應到情緒承載"}, {"type": "text", "content": "情緒不可怕，沒有承載力才可怕"}, {"type": "text", "content": "真正改變人生的，不是情緒消失，而是你開始「承載情緒」。很多人一輩子都活在情緒反應裡：被刺激就爆炸，被否定就崩潰，被忽略就焦慮，被拒絕就逃避。很多人以為這叫個性，但其實這只是：神經系統自動反應。"}, {"type": "text", "content": "很多人的人生，其實不是被現實控制，而是被情緒反應控制。一焦慮就拖延，一難過就暴食，一孤單就依附，一生氣就傷人，一被否定就懷疑自己——所有決策都被情緒接管。"}, {"type": "text", "content": "很多人從小學到的是：哭＝不對，生氣＝不好，難過＝脆弱。於是很多人只有兩種模式：情緒失控或情緒壓抑。但真正成熟的人，不是壓住情緒，而是能讓情緒流過自己。"}, {"type": "text", "content": "從神經科學角度，情緒反應其實是神經系統的快速生存模式。當情緒被觸發，杏仁核會立刻啟動，系統進入戰鬥、逃跑、僵住。所以很多人不是故意失控，而是系統沒有空間。"}, {"type": "text", "content": "真正高階的人，不是沒情緒，而是前額葉仍然在線。也就是：情緒來時，系統仍然能觀察、停頓、選擇。這就是：情緒承載。"}, {"type": "text", "content": "真正的更新，不是消滅情緒，而是建立情緒空間。第一步：延遲反應——情緒來時先不要立刻行動，停頓會讓前額葉重新上線。第二步：允許情緒存在——很多人真正耗能的，不是情緒，而是抗拒情緒。第三步：練習觀察——「我現在正在生氣」，不是「我就是這樣」。第四步：建立新神經路徑：情緒來→覺察→承載→回應，而不是情緒來→爆炸。"}, {"type": "text", "content": "後記"}, {"type": "text", "content": "讀完這本書，你可能會發現：從來沒有一章是在教你「消滅情緒」。"}, {"type": "text", "content": "因為情緒從來不是敵人。它是大腦在偵測到失衡之後，發出的誤差訊號。讀懂它，你才能真正知道：哪裡失衡了，哪裡需要被看見，哪個模型需要被更新。"}, {"type": "text", "content": "真正的成熟，不是沒有情緒，不是永遠平靜，不是不被觸發——而是：即使情緒來了，你仍然有選擇。"}, {"type": "text", "content": "你可以理解它。你可以承載它。你可以穿越它。"}, {"type": "text", "content": "這才是真正的人生成熟。"}, {"type": "text", "content": "—— 願你學會讀懂情緒，而不再被它控制"}, {"type": "text", "content": "第一章  情緒反覆重播的真相"}, {"type": "text", "content": "第二章  焦慮其實是預測失控"}, {"type": "text", "content": "第三章  情緒如何綁架決策"}, {"type": "text", "content": "第四章  情緒命名：大腦重寫的開始"}, {"type": "text", "content": "第五章  神經迴路與情緒記憶"}, {"type": "text", "content": "第七章  真正成熟：被誤解時仍穩定"}, {"type": "text", "content": "第八章  從情緒反應到情緒承載"}, {"type": "table", "rows": [["第一章  情緒反覆重播的真相"], ["第二章  焦慮其實是預測失控"], ["第三章  情緒如何綁架決策"], ["第四章  情緒命名：大腦重寫的開始"], ["第五章  神經迴路與情緒記憶"], ["第七章  真正成熟：被誤解時仍穩定"], ["第八章  從情緒反應到情緒承載"]]}, {"type": "text", "content": "情緒從來不是來毀掉你的。它是大腦在偵測到失衡之後，發出的誤差訊號。讀懂它，你才能真正更新自己。"}, {"type": "table", "rows": [["情緒從來不是來毀掉你的。它是大腦在偵測到失衡之後，發出的誤差訊號。讀懂它，你才能真正更新自己。"]]}, {"type": "text", "content": "情緒不是隨機的。每一個情緒背後，都有它的模型。讀懂情緒，等於讀懂你的系統。"}, {"type": "table", "rows": [["情緒不是隨機的。每一個情緒背後，都有它的模型。讀懂情緒，等於讀懂你的系統。"]]}, {"type": "text", "content": "❌ 低維語法"}, {"type": "text", "content": "✅ 高維語法"}, {"type": "text", "content": "情緒＝我的問題"}, {"type": "text", "content": "情緒＝系統誤差訊號"}, {"type": "text", "content": "我很焦慮"}, {"type": "text", "content": "系統正在產生焦慮"}, {"type": "text", "content": "我放不下"}, {"type": "text", "content": "系統還沒完成更新"}, {"type": "text", "content": "我太脆弱"}, {"type": "text", "content": "系統正在高警戒"}, {"type": "text", "content": "情緒是敵人"}, {"type": "text", "content": "情緒是更新入口"}, {"type": "table", "rows": [["❌ 低維語法", "✅ 高維語法"], ["情緒＝我的問題", "情緒＝系統誤差訊號"], ["我很焦慮", "系統正在產生焦慮"], ["我放不下", "系統還沒完成更新"], ["我太脆弱", "系統正在高警戒"], ["情緒是敵人", "情緒是更新入口"]]}, {"type": "text", "content": "【舊語法】 我情緒太多了"}, {"type": "text", "content": "【新語法】 系統正在持續提醒我有些地方需要校準"}, {"type": "table", "rows": [["【舊語法】 我情緒太多了", "↓", "【新語法】 系統正在持續提醒我有些地方需要校準"]]}, {"type": "text", "content": "─────────────────"}, {"type": "text", "content": "本章核心句"}, {"type": "text", "content": "情緒不是敵人。"}, {"type": "text", "content": "情緒是：大腦的誤差訊號。"}, {"type": "text", "content": "真正成熟，"}, {"type": "text", "content": "不是沒有情緒。"}, {"type": "text", "content": "而是：能承載情緒。"}, {"type": "text", "content": "情緒會重播，"}, {"type": "text", "content": "代表模型還沒更新。"}, {"type": "table", "rows": [["─────────────────"], ["本章核心句"], ["─────────────────"], ["情緒不是敵人。"], ["情緒是：大腦的誤差訊號。"], ["真正成熟，"], ["不是沒有情緒。"], ["而是：能承載情緒。"], ["情緒會重播，"], ["代表模型還沒更新。"]]}, {"type": "text", "content": "焦慮不是你太敏感，而是你的預測系統在用舊版本保護你。真正的更新，是重新校準那個系統。"}, {"type": "table", "rows": [["焦慮不是你太敏感，而是你的預測系統在用舊版本保護你。真正的更新，是重新校準那個系統。"]]}, {"type": "text", "content": "低維｜高熵焦慮"}, {"type": "text", "content": "高維｜低熵穩定"}, {"type": "text", "content": "焦慮＝我很弱"}, {"type": "text", "con 家都討厭我？", "↓", "【新語法】 系統正在過度依賴外界認可。"]]}, {"type": "text", "content": "【舊語法】 我一定要解釋清楚"}, {"type": "text", "content": "【新語法】 我不需要控制所有人的理解。"}, {"type": "table", "rows": [["【舊語法】 我一定要解釋清楚", "↓", "【新語法】 我不需要控制所有人的理解。"]]}, {"type": "text", "content": "不是永遠被理解。"}, {"type": "text", "content": "而是：被誤解時，仍然穩定。"}, {"type": "text", "content": "不是所有人都喜歡你。"}, {"type": "text", "content": "而是：即使不被理解，"}, {"type": "text", "content": "你仍不失去自己。"}, {"type": "table", "rows": [["─────────────────"], ["本章核心句"], ["─────────────────"], ["真正成熟，"], ["不是永遠被理解。"], ["而是：被誤解時，仍然穩定。"], ["真正自由，"], ["不是所有人都喜歡你。"], ["而是：即使不被理解，"], ["你仍不失去自己。"]]}, {"type": "text", "content": "真正成熟的人，不是情緒最少的人，而是最能承載情緒的人。"}, {"type": "table", "rows": [["真正成熟的人，不是情緒最少的人，而是最能承載情緒的人。"]]}, {"type": "text", "content": "低維｜情緒反應"}, {"type": "text", "content": "高維｜情緒承載"}, {"type": "text", "content": "情緒來先承載"}, {"type": "text", "content": "生氣就爆炸"}, {"type": "text", "content": "生氣仍能觀察"}, {"type": "text", "content": "焦慮就逃避"}, {"type": "text", "content": "焦慮仍能行動"}, {"type": "text", "content": "壓抑情緒"}, {"type": "text", "content": "允許情緒流動"}, {"type": "text", "content": "情緒＝我"}, {"type": "text", "content": "情緒＝訊號"}, {"type": "text", "content": "痛苦＝威脅"}, {"type": "text", "content": "痛苦＝承載訓練"}, {"type": "text", "content": "高反應性"}, {"type": "text", "content": "高穩定性"}, {"type": "table", "rows": [["低維｜情緒反應", "高維｜情緒承載"], ["情緒來就反應", "情緒來先承載"], ["生氣就爆炸", "生氣仍能觀察"], ["焦慮就逃避", "焦慮仍能行動"], ["壓抑情緒", "允許情緒流動"], ["情緒＝我", "情緒＝訊號"], ["痛苦＝威脅", "痛苦＝承載訓練"], ["高反應性", "高穩定性"]]}, {"type": "text", "content": "【舊語法】 我控制不了情緒"}, {"type": "text", "content": "【新語法】 系統正在自動反應。"}, {"type": "table", "rows": [["【舊語法】 我控制不了情緒", "↓", "【新語法】 系統正在自動反應。"]]}, {"type": "text", "content": "【舊語法】 我不想有情緒"}, {"type": "text", "content": "【新語法】 我要提升情緒承載力。"}, {"type": "table", "rows": [["【舊語法】 我不想有情緒", "↓", "【新語法】 我要提升情緒承載力。"]]}, {"type": "text", "content": "情緒不可怕。"}, {"type": "text", "content": "沒有承載力，才可怕。"}, {"type": "text", "content": "不是永遠舒服。"}, {"type": "text", "content": "而是：即使不         DATA['emotion_system.docx'] = JSON.parse(`{"name": "情緒系統", "items": [{"type": "text", "content": "情緒系統學"}, {"type": "text", "content": "Emotion System Design"}, {"type": "text", "content": "從高熵內耗到低熵流動的完整指南"}, {"type": "text", "content": "情緒不是敵人，是系統在提醒你有些地方該更新了"}, {"type": "text", "content": "情緒不是讓你停下來的，是讓你更新的 🔥"}, {"type": "text", "content": "前言"}, {"type": "text", "content": "你有沒有試過壓制情緒？"}, {"type": "text", "content": "焦慮的時候，告訴自己「不要亂想」。憤怒的時候，把它硬吞下去。悲傷的時候，逼自己振作。然後發現——它根本沒有消失，只是換了一個地方。"}, {"type": "text", "content": "變成失眠，變成疲憊，變成說不清楚的煩躁，變成在某個普通的下午突然崩潰。"}, {"type": "text", "content": "這本書要說的，是一個很多人從來沒有想過的問題：情緒，究竟是什麼？"}, {"type": "text", "content": "從系統角度看，每一個情緒都有它精確的意義：焦慮是預測系統在高度運轉；憤怒是邊界系統在發出警報；悲傷是連結系統在修復失去；羞愧是身份系統在不穩定。"}, {"type": "text", "content": "真正的問題，從來不是情緒太多——而是我們不知道怎麼讀懂它。"}, {"type": "text", "content": "這本書分為七個部分，從情緒的本質出發，到抗傷能力的建立，到五大情緒錯誤轉換的糾正，到50種情緒的系統解碼，最後到整個人系統的重新校準。"}, {"type": "text", "content": "每一章都有一個核心問題：你的系統，現在在哪裡？"}, {"type": "text", "content": "讓我們開始。"}, {"type": "text", "content": "— PART 1 —"}, {"type": "text", "content": "情緒的本質"}, {"type": "text", "content": "八層系統分析——情緒不是敵人，是警報"}, {"type": "text", "content": "PART 1｜本體"}, {"type": "text", "content": "第 一 章"}, {"type": "text", "content": "情緒是警報，不是敵人"}, {"type": "text", "content": "大多數人和情緒的關係，像是對著火警警報器大喊「閉嘴！」"}, {"type": "text", "content": "火警一直響，他們拔掉電池。然後繼續住在那棟失火的建築裡，以為問題解決了。"}, {"type": "text", "content": "情緒不是要被消滅的東西。情緒是你的大腦在偵測到系統偏差之後，發出的第一個訊號。它在說：「這裡有什麼東西需要注意。」"}, {"type": "text", "content": "從神經科學的角度，情緒是預測機器——你的大腦——在現實和預期之間出現落差時的反應。當這個落差被偵測到，大腦就發出一個信號，那個信號，就是你感受到的情緒。"}, {"type": "text", "content": "這本書把情緒系統分成八個層次：本體層（情緒的本質）、結構層（情緒如何形成）、機制層（不同情緒的控制機制）、能量層（情緒和神經頻寬的關係）、關係層（情緒如何影響人際）、身份層（情緒如何塑造自我認知）、更新層（情緒如何重新流動）、意識層（覺察帶來的真正自由）。"}, {"type": "text", "content": "每一層都有它的卡點，有它的真正問題，有它的舊語法和新語法。讀懂這八層，你就讀懂了你的情緒系統。"}, {"type": "text", "content": "八層情緒系統完整分析表"}, {"type": "text", "content": "PART 1｜機制"}, {"type": "text", "content": "第 二 章"}, {"type": "text", "content": "四種核心情緒的系統密碼"}, {"type": "text", "content": "讓我們更深入地看四種最常見的核心情緒——焦慮、憤怒、悲傷、羞愧。這四種情緒的出現頻率最高，被誤解的程度也最深。"}, {"type": "text", "content": "焦慮，是預測系統失控的訊號。你的大腦在不斷模擬未來的各種可能性，當它無法產生一個「穩定可預測的未來」時，它就啟動了焦慮。不是因為你太悲觀——而是因為你的預測模型沒有足夠的穩定感來錨定未來。"}, {"type": "text", "content": "憤怒，是邊界系統的警報。當你的邊界被侵犯——不管是身體的、情感的、還是心理的——憤怒就是那個在說「這裡不行」的訊號。容易爆炸的人，往往不是脾氣差，而是邊界長期被忽略、長期被踩，最終系統選擇了最直接的方式來回應。"}, {"type": "text", "content": "悲傷，是連結系統在修復失去。當一段重要的關係、一個重要的目標、一個重要的自我認知被打破，系統需要時間修復。悲傷不是弱點，它是修復進行中的訊號。壓抑悲傷，等於阻止修復。"}, {"type": "text", "content": "羞愧，是身份系統在不穩定。它出現在一個人覺得自己的存在本身有問題的時候。羞愧是所有情緒裡最消耗能量的一種，因為它攻擊的不是行為，而是整個人格。把「這件事做錯了」和「我是個錯誤的人」分開，是走出羞愧的第一步。"}, {"type": "text", "content": "— PART 2 —"}, {"type": "text", "content": "抗傷能力"}, {"type": "text", "content": "讓系統有緩衝——不是沒有情緒，是情緒來了不崩潰"}, {"type": "text", "content": "PART 2｜抗傷"}, {"type": "text", "content": "第 三 章"}, {"type": "text", "content": "真正的抗傷能力"}, {"type": "text", "content": "很多人以為，心理強壯的人不會受傷。"}, {"type": "text", "content": "錯了。真正心理強壯的人，同樣會受傷、同樣會難過——但他們的系統有一個東西，叫做「緩衝能力」。"}, {"type": "text", "content": "緩衝能力，是在刺激和反應之間，留出一個空間。在這個空間裡，你有機會選擇如何回應，而不是讓情緒直接接管。"}, {"type": "text", "content": "低抗傷的人和高抗傷的人，面對同樣的壓力，系統的反應完全不同。"}, {"type": "text", "content": "六大抗傷核心策略"}, {"type": "text", "content": "①延遲反應：情緒來了，先停10秒。不要立刻回訊息，不要立刻爆炸。那10秒鐘，是你和被情緒接管之間的距離。"}, {"type": "text", "content": "②降低熵增：累的時候不要做重大決定。先睡覺，先吃飯，先補水。神經穩了，才有能力處理問題。"}, {"type": "text", "content": "③分離事件與身份：「這次失敗」不等於「我很爛」。失敗是模型需要更新，不是人格的否定。"}, {"type": "text", "content": "④建立穩定節律：固定睡眠、固定運動、固定安靜時間。神經穩，情緒才穩。這不是放縱，而是在為系統建底盤。"}, {"type": "text", "content": "⑤建立情緒出口：寫下來、說出來、走路、運動、深呼吸。情緒需要出口，封死只會讓壓力累積。"}, {"type": "text", "content": "⑥降低高刺激：少滑短影音、少看情緒新聞、少接高耗能關係。因為你的頻寬有限，保護它。"}, {"type": "text", "content": "— PART 3 —"}, {"type": "text", "content": "情緒抗熵"}, {"type": "text", "content": "20個方法——從高熵內耗到低熵流動"}, {"type": "text", "content": "PART 3｜抗熵"}, {"type": "text", "content": "第 四 章"}, {"type": "text", "content": "20個讓情緒重新流動的方法"}, {"type": "text", "content": "「熵」，是物理學裡描述系統混亂程度的概念。熵越高，系統越混亂；熵越低，系統越有秩序、越有能量。"}, {"type": "text", "content": "高熵情緒，就是長期的內耗狀態——情緒不斷地消耗能量，卻沒有流動和修復。低熵情緒，是情緒能夠流動、系統能夠恢復的狀態。"}, {"type": "text", "content": "以下20個方法，不是讓你沒有情緒，而是幫你的情緒系統從高熵狀態，逐步回到低熵狀態。"}, {"type": "text", "content": "①先睡飽  睡眠不足，大腦會放大威脅。一切的修復，都從睡眠開始。"}, {"type": "text", "content": "②固定作息  規律會降低神經混亂。身體知道接下來要發生什麼，警戒系統就會放鬆。"}, {"type": "text", "content": "③少看高刺激短影音  大腦會被碎片化，注意力耗散，情緒更難穩定。"}, {"type": "text", "content": "④情緒來先停10秒  避免自動爆炸。那10秒是系統插入「覺察」的機會。"}, {"type": "text", "content": "⑤每天運動20分鐘  讓壓力代謝出去。身體是情緒最直接的出口。"}, {"type": "text", "content": "⑥固定補水  缺水會提高焦躁感。身體的基本供能影響神經狀態。"}, {"type": "text", "content": "⑦不要空腹太久  低血糖會放大情緒反應。血糖穩，情緒才穩。"}, {"type": "text", "content": "⑧少熬夜  熵增最快的習慣之一。每一個熬夜，都在讓系統付利息。"}, {"type": "text", "content": "⑨每天安靜5分鐘  讓大腦降噪。在資訊轟炸的世界裡，安靜是稀缺資源。"}, {"type": "text", "content": "⑩把情緒寫下來  情緒會從混亂變清楚。外化的過程，就是整理的過程。"}, {"type": "text", "content": "⑪少跟高耗能的人久待  情緒會共振感染。你的情緒頻率，會被周圍的人影響。"}, {"type": "text", "content": "⑫學會拒絕  邊界不清，內耗就會增加。每一次說「不」，都是在保護你的頻寬。"}, {"type": "text", "content": "⑬不要一次處理太多事  頻寬超載，系統容易崩。一次一件，穩定前進。"}, {"type": "text", "content": "⑭建立小完成  完成感會提升穩定感。每一個小的完成，都在向大腦說「我還行」。"}, {"type": "text", "content": "⑮少自責  過度攻擊自己，會讓系統長期高壓。把自責換成「哪裡可以調整」。"}, {"type": "text", "content": "⑯多曬太陽  光線影響神經穩定。每天至少20分鐘自然光。"}, {"type": "text", "content": "⑰固定真實連結  長期孤立，情緒容易失衡。真實的連結，是情緒系統的養分。"}, {"type": "text", "content": "⑱少反覆回想痛苦  大腦會強化舊迴路。每一次重播，都在讓神經路徑更深。"}, {"type": "text", "content": "⑲把「我很糟」改成「我現在狀態不好」  身份不要綁定情緒。狀態是暫時的，不是你是誰。"}, {"type": "text", "content": "⑳允許情緒流動  能流動，才會修復。情緒被允許存在，它才會真正離開。"}, {"type": "text", "content": "— PART 4 —"}, {"type": "text", "content": "高熵 vs 低熵"}, {"type": "text", "content": "兩種情緒系統——你的系統在耗散還是在恢復？"}, {"type": "text", "content": "PART 4｜系統"}, {"type": "text", "content": "第 五 章"}, {"type": "text", "content": "高熵系統與低熵系統"}, {"type": "text", "content": "有些人遇到壓力，會越來越亂。有些人遇到壓力，反而越來越穩。"}, {"type": "text", "content": "差別不只是個性。而是他們的情緒系統，一個是高熵的，一個是低熵的。"}, {"type": "text", "content": "高熵情緒系統的核心目標函數是：「趕快消除不舒服」。所以系統會優先選擇逃避、防禦、壓抑、短期止痛。但代價是：長期越來越亂。"}, {"type": "text", "content": "低熵情緒系統的核心目標函數是：「提升穩定性、增加恢復力、提高更新能力」。所以每次情緒，都變成一次模型修正。每次壓力，都變成一次系統升級。"}, {"type": "text", "content": "高熵路徑：刺激→情緒爆炸→逃避/壓抑→內耗增加→神經失衡→頻寬下降→舊迴路強化→更容易失控。"}, {"type": "text", "content": "低熵路徑：刺激→覺察情緒→分析誤差→穩定神經→更新模型→建立新迴路→恢復平衡→系統升級。"}, {"type": "text", "content": "選擇低熵，不是要你強迫自己快樂。而是建立一個系統，讓你在受傷之後，能夠真正地恢復。"}, {"type": "text", "content": "— PART 5 —"}, {"type": "text", "content": "情緒錯誤轉換"}, {"type": "text", "content": "五大模組——情緒不是判決書"}, {"type": "text", "content": "PART 5｜轉換"}, {"type": "text", "content": "第 六 章"}, {"type": "text", "content": "情緒不是判決書"}, {"type": "text", "content": "你有沒有過這樣的經驗：被拒絕了一次，然後整個人開始覺得「我是不是真的很爛」？被忽略了，就變成「沒人愛我」？失敗了一次，就成了「我就是個失敗者」？"}, {"type": "text", "content": "這不是你太脆弱。這是一個叫做「情緒錯誤轉換」的機制在運作——你的大腦把一個暫時的「狀態」，錯誤地翻譯成了永久的「身份」。"}, {"type": "text", "content": "五大情緒錯誤轉換模組"}, {"type": "text", "content": "錯誤轉換的核心問題在於：大腦把「狀態」錯誤轉成「身份」。狀態是暫時的，身份是持久的——當你讓情緒定義了你是誰，你就失去了改變的空間。"}, {"type": "text", "content": "糾正這個錯誤的起點，是語法的改變。不說「我很焦慮」，改說「我正在經歷焦慮」。不說「我失敗了」，改說「這次的策略需要更新」。這不是自我欺騙，而是語言幫助大腦重新校準現實。"}, {"type": "text", "content": "低熵轉換的路徑：刺激→覺察情緒→分離身份→校準模型→更新行動。每一次的正確轉換，都是一次小小的自由。"}, {"type": "text", "content": "— PART 6 —"}, {"type": "text", "content": "50種情緒解碼"}, {"type": "text", "content": "每一種情緒，都有它的系統意義"}, {"type": "text", "content": "PART 6｜解碼"}, {"type": "text", "content": "第 七 章"}, {"type": "text", "content": "50種負面情緒的完整指南"}, {"type": "text", "content": "我們常常遇到一種困境：感受到一種情緒，但說不清楚它是什麼，也不知道該怎麼辦。"}, {"type": "text", "content": "以下50種情緒，每一種都有它在系統裡的精確含義，以及對應的第一個行動。這不是要你強迫自己立刻改變——而是給你一個地圖，讓你至少知道你在哪裡，往哪裡走。"}, {"type": "text", "content": "— PART 7 —"}, {"type": "text", "content": "人系統重新校準"}, {"type": "text", "content": "從情緒到整體——八個系統同時恢復"}, {"type": "text", "content": "PART 7｜系統"}, {"type": "text", "content": "第 八 章"}, {"type": "text", "content": "人不是單一器官，是多系統整合體"}, {"type": "text", "content": "當情緒長期失衡，它不會只停留在情緒層面。它會蔓延——影響你的睡眠、影響你的認知、影響你的關係、影響你的行動能力。"}, {"type": "text", "content": "反過來說，當身體系統出了問題（睡眠不足、供能不穩），情緒也會跟著失衡。當關係系統出了問題（邊界混亂、過度依附），情緒耗能就會增加。"}, {"type": "text", "content": "這就是為什麼，真正的療癒不是只修一個地方——而是讓整個系統重新對齊。"}, {"type": "text", "content": "八大系統失衡全覽"}, {"type": "text", "content": "高熵 vs 低熵系統循環"}, {"type": "text", "content": "你不需要同時修復所有的系統。但你需要知道，它們是彼此連結的。修復其中一個，往往會帶動其他的。通常最好的起點是：先穩住睡眠。睡眠穩了，神經才有機會穩；神經穩了，情緒才有空間被觀察；情緒被觀察了，認知才能校準；認知校準了，行動才能穩定輸出。"}, {"type": "text", "content": "一個系統，慢慢帶動另一個系統。"}, {"type": "text", "content": "結語"}, {"type": "text", "content": "情緒，從來不是來毀掉你的。"}, {"type": "text", "content": "它是你的系統，在提醒你：有些地方，該更新了。"}, {"type": "text", "content": "焦慮不是告訴你「你快完蛋了」，它是告訴你「系統需要更多穩定感」。憤怒不是你的性格缺陷，它是說「有一條邊界，需要被建立」。悲傷不是脆弱，它是修復的過程。羞愧不是真相，它是身份系統在尋找新的錨點。"}, {"type": "text", "content": "真正的情緒自由，不是永遠快樂，不是沒有負面情緒。"}, {"type": "text", "content": "而是：你開始有能力觀察情緒，而不是被情緒拖走。你開始有能力讓堵塞的能量重新流動。你開始把每一次的情緒，當成一次系統更新的機會，而不是一次人格的審判。"}, {"type": "text", "content": "這本書是一個起點。真正的練習，在每一次情緒出現的那一刻。"}, {"type": "text", "content": "—— 願你不再和情緒為敵，而是學會讀懂它"}, {"type": "text", "content": "PART 1｜情緒的本質：八層系統分析"}, {"type": "text", "content": "PART 2｜抗傷能力：讓系統不崩潰"}, {"type": "text", "content": "PART 3｜情緒抗熵：20個恢復方法"}, {"type": "text", "content": "PART 4｜高熵 vs 低熵：兩種情緒系統"}, {"type": "text", "content": "PART 5｜情緒錯誤轉換：五大模組"}, {"type": "text", "content": "PART 6｜50種情緒完整解碼"}, {"type": "text", "content": "PART 7｜人系統失衡：整體校準"}, {"type": "table", "rows": [["PART 1｜情緒的本質：八層系統分析"], ["PART 2｜抗傷能力：讓系統不崩潰"], ["PART 3｜情緒抗熵：20個恢復方法"], ["PART 4｜高熵 vs 低熵：兩種情緒系統"], ["PART 5｜情緒錯誤轉換：五大模組"], ["PART 6｜50種情緒完整解碼"], ["PART 7｜人系統失衡：整體校準"]]}, {"type": "text", "content": "情緒從來不是錯誤。它是你的系統，在偵測到失衡、威脅、或失去之後，發出的訊號。"}, {"type": "table", "rows": [["情緒從來不是錯誤。它是你的系統，在偵測到失衡、威脅、或失去之後，發出的訊號。"]]}, {"type": "text", "content": "你以為情緒是問題，其實情緒是答案——只是你還不會讀。"}, {"type": "table", "rows": [["你以為情緒是問題，其實情緒是答案——只是你還不會讀。"]]}, {"type": "text", "content": "情緒反覆重播，不是因為你太脆弱。而是因為系統還沒有完成校準——它在等你讀懂它在說什麼。"}, {"type": "table", "rows": [["情緒反覆重播，不是因為你太脆弱。而是因為系統還沒有完成校準——它在等你讀懂它在說什麼。"]]}, {"type": "text", "content": "核心概念"}, {"type": "text", "content": "真正問題"}, {"type": "text", "content": "舊語法"}, {"type": "text", "content": "新語法"}, {"type": "text", "conte             try {
                const saved = localStorage.getItem('translations');
                if (saved) translations = JSON.parse(saved);
            } catch (e) {}
        }
        
        function createTabs() {
            const tabsDiv = document.getElementById('tabs');
            const contentDiv = document.getElementById('content');
            let isFirst = true;
            
            Object.entries(DATA).forEach(([key, data]) => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (isFirst ? ' active' : '');
                btn.textContent = data.name;
                btn.onclick = () => switchTab(key);
                tabsDiv.appendChild(btn);
                
                const tab = document.createElement('div');
                tab.className = 'tab-content' + (isFirst ? ' active' : '');
                
                let html = '';
                if (data.items) {
                    data.items.forEach((item, idx) => {
                        if (item.type === 'text') {
                            html += renderText(item.content);
                        } else if (item.type === 'table') {
                            html += renderTable(item.rows);
                        }
                    });
                }
                
                tab.innerHTML = html;
                contentDiv.appendChild(tab);
                isFirst = false;
            });
        }
        
        function renderText(text) {
            const trans = translations[text] || '';
            return `<div class="item" onclick="this.classList.toggle('open')">
                <div class="item-header">
                    <div class="item-cn">${escapeHtml(text)}</div>
                    <span class="item-icon">▾</span>
                </div>
                <div class="item-en">
                    <div class="en-box">${trans || '⏳ 等待翻譯...'}</div>
                    ${trans ? `<button class="tts-btn" onclick="speak('${escapeSpeech(trans)}');event.stopPropagation();">🔊 Read</button>` : ''}
                </div>
            </div>`;
        }
        
        function renderTable(rows) {
            let html = '<div class="table-box"><table>';
            rows.forEach((row, ridx) => {
                html += '<tr>';
                row.forEach(cell => {
                    const tag = ridx === 0 ? 'th' : 'td';
                    html += `<${tag}>${escapeHtml(cell)}</${tag}>`;
                });
                html += '</tr>';
            });
            return html + '</table></div>';
        }
        
        function switchTab(key) {
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', Object.keys(DATA)[idx] === key);
            });
            document.querySelectorAll('.tab-content').forEach((tab, idx) => {
                tab.classList.toggle('active', Object.keys(DATA)[idx] === key);
            });
        }
        
        function expandAll() {
            document.querySelectorAll('.item').forEach(e => e.classList.add('open'));
        }
        
        function collapseAll() {
            document.querySelectorAll('.item').forEach(e => e.classList.remove('open'));
        }
        
        async function startTranslate() {
            const key = localStorage.getItem('api_key') || prompt('請輸入 Anthropic API Key:');
            if (!key) return;
            localStorage.setItem('api_key', key);
            
            const btn = document.getElementById('trans-btn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.style.display = 'block';
            
            const texts = [];
            const map = {};
            document.querySelectorAll('.item').forEach(el => {
                const text = el.querySelector('.item-cn').textContent.trim();
                if (text && !translations[text]) {
                    texts.push(text);
                    if (!map[text]) map[text] = [];
                    map[text].push(el);
                }
            });
            
            if (!texts.length) {
                status.textContent = '✓ 全部已翻譯！';
                setTimeout(() => { status.style.display = 'none'; btn.disabled = false; }, 2000);
                return;
            }
            
            status.textContent = `正在翻譯: 0/${texts.length}`;
            const batch = 10;
            for (let i = 0; i < texts.length; i += batch) {
                const chunk = texts.slice(i, i + batch);
                await translateChunk(chunk, key);
                updateUI(map);
                status.textContent = `正在翻譯: ${Math.min(i + batch, texts.length)}/${texts.length}`;
            }
            localStorage.setItem('translations', JSON.stringify(translations));
            status.textContent = '✓ 翻譯完成！';
            updateStats();
            setTimeout(() => { status.style.display = 'none'; btn.disabled = false; }, 2000);
        }
        
        async function translateChunk(texts, key) {
            try {
                const resp = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'x-api-key': key,
                        'anthropic-version': '2023-06-01',
                        'content-type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'claude-opus-4-6',
                        max_tokens: 2000,
                        messages: [{role: 'user', content: `翻譯成英文（每行一個翻譯，無序號）:\n${texts.join('\n')}`}]
                    })
                });
                const data = await resp.json();
                if (data.content?.[0]?.text) {
                    const lines = data.content[0].text.trim().split('\n');
                    texts.forEach((text, idx) => {
                        const trans = lines[idx]?.replace(/^\d+\.\s*/, '').trim();
                        if (trans && trans.length > 2) translations[text] = trans;
                    });
                }
            } catch (e) { console.error(e); }
        }
        
        function updateUI(map) {
            Object.entries(map).forEach(([text, els]) => {
                if (translations[text]) {
                    els.forEach(el => {
                        const box = el.querySelector('.en-box');
                        if (box) box.textContent = translations[text];
                        if (!el.querySelector('.tts-btn')) {
                            const btn = document.createElement('button');
                            btn.className = 'tts-btn';
                            btn.textContent = '🔊 Read';
                            btn.onclick = e => {speak(translations[text]); e.stopPropagation()};
                            box.parentElement.appendChild(btn);
                        }
                    });
                }
            });
        }
        
        function speak(text) {
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            speechSynthesis.speak(u);
        }
        
        function updateStats() {
            let texts = 0, tables = 0;
            Object.values(DATA).forEach(d => {
                if (d.items) d.items.forEach(i => {
                    if (i.type === 'text') texts++;
                    if (i.type === 'table') tables++;
                });
            });
            document.getElementById('stats').innerHTML = `
                <div class="stat"><div class="stat-num">${Object.keys(DATA).length}</div><div class="stat-label">檔案</div></div>
                <div class="stat"><div class="stat-num">${texts}</div><div class="stat-label">可翻譯項</div></div>
                <div class="stat"><div class="stat-num">${tables}</div><div class="stat-label">表格</div></div>
                <div class="stat"><div class="stat-num">${Object.keys(translations).length}</div><div class="stat-label">已翻譯</div></div>
            `;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function escapeSpeech(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
        
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
