<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙語文檔應用系統 | Bilingual Documents App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft JhengHei", "Helvetica", sans-serif;
            background-color: #ffffff;
            color: #1A2B5F;
            line-height: 1.8;
        }
        
        .header {
            background: linear-gradient(135deg, #1A2B5F 0%, #0A7A72 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.95;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .stat-box {
            background: linear-gradient(135deg, #0A7A72 0%, #006B7D 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        
        .stat-box .number {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-box .label {
            font-size: 13px;
            opacity: 0.95;
        }
        
        .info-bar {
            background: #f0fffe;
            padding: 15px 20px;
            border-left: 4px solid #0A7A72;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        
        .control-panel input,
        .control-panel select {
            padding: 12px;
            border: 2px solid #0A7A72;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            background: white;
        }
        
        .control-panel input:focus,
        .control-panel select:focus {
            outline: none;
            border-color: #C9960C;
            box-shadow: 0 0 0 3px rgba(201, 150, 12, 0.1);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 20px;
            background-color: #C9960C;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        .btn:hover {
            background-color: #B8860B;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .doc-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .doc-btn {
            padding: 15px;
            border: 2px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }
        
        .doc-btn:hover {
            border-color: #0A7A72;
            background-color: #f0fffe;
            box-shadow: 0 2px 6px rgba(10, 122, 114, 0.15);
        }
        
        .doc-btn.active {
            background-color: #0A7A72;
            color: white;
            border-color: #0A7A72;
            box-shadow: 0 4px 12px rgba(10, 122, 114, 0.3);
        }
        
        .doc-count {
            display: block;
            font-size: 12px;
            opacity: 0.8;
            margin-top: 5px;
        }
        
        .content-area {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 30px;
            min-height: 500px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .item-container {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .item-container:last-child {
            border-bottom: none;
        }
        
        .item-number {
            display: inline-block;
            background-color: #C9960C;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .item-text {
            background-color: #fafafa;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #0A7A72;
            font-size: 16px;
            line-height: 1.7;
            color: #1A2B5F;
            margin-bottom: 8px;
        }
        
        .tts-btn {
            display: inline-block;
            margin-left: 8px;
            padding: 6px 12px;
            background-color: #C9960C;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            vertical-align: middle;
            transition: all 0.2s;
        }
        
        .tts-btn:hover {
            background-color: #B8860B;
            transform: scale(1.05);
        }
        
        .tts-btn.playing {
            background-color: #0A7A72;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        .pagination button {
            padding: 10px 15px;
            border: 1px solid #0A7A72;
            background: white;
            color: #0A7A72;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .pagination button:hover {
            background-color: #0A7A72;
            color: white;
            transform: translateY(-2px);
        }
        
        .pagination button.active {
            background-color: #0A7A72;
            color: white;
            box-shadow: 0 4px 8px rgba(10, 122, 114, 0.3);
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 18px;
            color: #0A7A72;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top-color: #0A7A72;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .no-results svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        @media (max-width: 768px) {
            .doc-selector {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            }
            
            .control-panel {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 22px;
            }
            
            .content-area {
                padding: 20px;
            }
            
            .item-text {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📚 雙語文檔應用系統</h1>
        <p>Bilingual Documents Application System</p>
    </div>
    
    <div class="container">
        <div class="stats" id="statsContainer"></div>
        
        <div class="info-bar">
            <span>💡</span>
            <span><strong>說明：</strong>選擇文檔 → 瀏覽內容 → 點擊 🔊 聽中文朗讀</span>
        </div>
        
        <div class="control-panel">
            <div>
                <select id="itemsPerPage" onchange="app.changeItemsPerPage(this.value)">
                    <option value="10">每頁 10 項</option>
                    <option value="20" selected>每頁 20 項</option>
                    <option value="50">每頁 50 項</option>
                    <option value="100">每頁 100 項</option>
                </select>
            </div>
            <div>
                <input type="text" id="searchInput" placeholder="搜尋關鍵字..." onkeyup="app.search(this.value)">
            </div>
            <div class="button-group">
                <button class="btn" onclick="app.resetAll()">🔄 重設</button>
                <button class="btn" onclick="app.toggleTTS()">🔊 全文朗讀</button>
            </div>
        </div>
        
        <div class="doc-selector" id="docSelector"></div>
        
        <div class="content-area">
            <div id="contentContainer"></div>
            <div class="pagination" id="paginationContainer"></div>
        </div>
    </div>
    
    <script>
        class BilingualApp {
            constructor(documents) {
                this.documents = documents || [];
                this.currentDocId = 1;
                this.currentPage = 1;
                this.itemsPerPage = 20;
                this.searchTerm = '';
                this.ttsEnabled = false;
                this.currentUtterance = null;
                
                console.log('App initialized with', this.documents.length, 'documents');
                this.init();
            }
            
            init() {
                try {
                    this.renderStats();
                    this.renderDocumentSelector();
                    this.render();
                    console.log('Initialization complete');
                } catch (e) {
                    console.error('Initialization error:', e);
                    this.showError('初始化失敗，請重新整理頁面');
                }
            }
            
            renderStats() {
                if (!this.documents || this.documents.length === 0) {
                    console.warn('No documents available');
                    return;
                }
                
                const totalItems = this.documents.reduce((sum, doc) => {
                    return sum + (doc.items && Array.isArray(doc.items) ? doc.items.length : 0);
                }, 0);
                
                const statsHtml = `
                    <div class="stat-box">
                        <div class="number">${this.documents.length}</div>
                        <div class="label">📖 文檔數</div>
                    </div>
                    <div class="stat-box">
                        <div class="number">${totalItems}</div>
                        <div class="label">📝 總項目</div>
                    </div>
                `;
                
                document.getElementById('statsContainer').innerHTML = statsHtml;
            }
            
            renderDocumentSelector() {
                const html = this.documents.map(doc => `
                    <button class="doc-btn ${doc.id === 1 ? 'active' : ''}" 
                            onclick="app.loadDocument(${doc.id})">
                        ${doc.title}
                        <span class="doc-count">(${doc.items ? doc.items.length : 0} 項)</span>
                    </button>
                `).join('');
                
                document.getElementById('docSelector').innerHTML = html;
            }
            
            loadDocument(docId) {
                this.currentDocId = docId;
                this.currentPage = 1;
                this.searchTerm = '';
                document.getElementById('searchInput').value = '';
                
                // 更新按鈕狀態
                document.querySelectorAll('.doc-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                event.target.closest('.doc-btn').classList.add('active');
                
                this.render();
            }
            
            getFilteredItems() {
                const doc = this.documents.find(d => d.id === this.currentDocId);
                if (!doc || !Array.isArray(doc.items)) return [];
                
                if (!this.searchTerm) return doc.items;
                
                return doc.items.filter(item => 
                    String(item).toLowerCase().includes(this.searchTerm.toLowerCase())
                );
            }
            
            render() {
                const items = this.getFilteredItems();
                const totalPages = Math.ceil(items.length / this.itemsPerPage) || 1;
                
                if (this.currentPage > totalPages) this.currentPage = 1;
                
                const startIdx = (this.currentPage - 1) * this.itemsPerPage;
                const pageItems = items.slice(startIdx, startIdx + this.itemsPerPage);
                
                if (pageItems.length === 0) {
                    document.getElementById('contentContainer').innerHTML = 
                        '<div class="no-results">📭 沒有找到匹配的內容<br><small>No matching content found</small></div>';
                } else {
                    let html = '';
                    pageItems.forEach((item, idx) => {
                        const itemNum = startIdx + idx + 1;
                        html += `
                            <div class="item-container">
                                <span class="item-number">#${itemNum}</span>
                                <div class="item-text">
                                    ${this.escapeHtml(String(item))}
                                    <button class="tts-btn" 
                                            onclick="app.speak('${this.escapeJs(String(item))}')" 
                                            title="朗讀此項">🔊</button>
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById('contentContainer').innerHTML = html;
                }
                
                this.renderPagination(totalPages);
            }
            
            renderPagination(totalPages) {
                if (totalPages <= 1) {
                    document.getElementById('paginationContainer').innerHTML = '';
                    return;
                }
                
                const buttons = [];
                
                if (this.currentPage > 1) {
                    buttons.push(`<button onclick="app.goToPage(1)">« 首頁</button>`);
                    buttons.push(`<button onclick="app.goToPage(${this.currentPage - 1})">‹ 前頁</button>`);
                }
                
                const start = Math.max(1, this.currentPage - 2);
                const end = Math.min(totalPages, this.currentPage + 2);
                
                if (start > 1) buttons.push(`<button disabled>...</button>`);
                
                for (let i = start; i <= end; i++) {
                    buttons.push(`
                        <button ${i === this.currentPage ? 'class="active"' : ''} 
                                onclick="app.goToPage(${i})">
                            ${i}
                        </button>
                    `);
                }
                
                if (end < totalPages) buttons.push(`<button disabled>...</button>`);
                
                if (this.currentPage < totalPages) {
                    buttons.push(`<button onclick="app.goToPage(${this.currentPage + 1})">後頁 ›</button>`);
                    buttons.push(`<button onclick="app.goToPage(${totalPages})">末頁 »</button>`);
                }
                
                document.getElementById('paginationContainer').innerHTML = `<div class="pagination">${buttons.join('')}</div>`;
            }
            
            goToPage(page) {
                this.currentPage = page;
                this.render();
                document.querySelector('.content-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            
            search(term) {
                this.searchTerm = term;
                this.currentPage = 1;
                this.render();
            }
            
            changeItemsPerPage(value) {
                this.itemsPerPage = parseInt(value);
                this.currentPage = 1;
                this.render();
            }
            
            resetAll() {
                this.searchTerm = '';
                this.currentPage = 1;
                this.currentDocId = 1;
                document.getElementById('searchInput').value = '';
                this.loadDocument(1);
            }
            
            speak(text) {
                if (!('speechSynthesis' in window)) {
                    alert('您的瀏覽器不支援語音功能');
                    return;
                }
                
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.9;
                
                window.speechSynthesis.speak(utterance);
            }
            
            toggleTTS() {
                this.ttsEnabled = !this.ttsEnabled;
                alert('功能開發中 | Feature coming soon');
            }
            
            escapeHtml(text) {
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return text.replace(/[&<>"']/g, m => map[m]);
            }
            
            escapeJs(text) {
                return text.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
            }
            
            showError(msg) {
                document.getElementById('contentContainer').innerHTML = `
                    <div class="no-results">❌ ${msg}</div>
                `;
            }
        }

      "力量不在於未來，力量始終存在於永恆的當下。 Power is not in the future; power always exists in the eternal now.",
      "關於行動與結果 (Action & Results)",
      "沒有應用的知識只是娛樂，唯有實踐才能帶來轉變。 Knowledge without application is just entertainment; only practice brings transformation.",
      "不要只是慢慢地想改變，要用決心與強度讓轉變變得不可避免。 Don't just slowly want to change; use determination and intensity to make transformation inevitable.",
      "改進不是因為你走運，改進是因為你決定與內在的一致性保持聯結。 Improvement isn't because you are lucky; improvement is because you decided to stay connected to your inner coherence.",
      "你現在就在創造你的未來，通過你此刻選擇的思想。 You are creating your future right now, through the thoughts you choose in this moment.",
      "今天就做出決定，轉變就從這一刻自動發生。 Make the decision today; the transformation happens automatically from this moment.",
      "關於轉變與時機 (Transformation & Timing)",
      "真正的人生並不從某個遙遠的未來開始，它就在妳決定改變的那一刻開始。 Your real life doesn't start in some distant future; it begins the moment you decide to change.",
      "轉變不是隨時間慢慢發生的，它是在妳意識轉變的那一瞬間完成的。 Transformation isn't something that happens slowly over time; it's completed the instant your consciousness shifts.",
      "能量才是轉變的貨幣，能量投入越多，轉化就越快。 Energy is the currency of transformation; the more energy you invest, the faster the change occurs.",
      "不要等到條件完美才開始，因為那那個所謂的完美時機永遠不會出現。 Don't wait for perfect conditions to start, because that so-called \"perfect time\" will never arrive.",
      "轉變要嘛此刻發生，要嘛根本不會發生。 Transformation either happens now, or it won't happen at all.",
      "關於大腦與神經科學 (The Brain & Neuroscience)",
      "你的大腦不分辨「當下發生的事」與「妳強力想像的事」。 Your brain does not distinguish between what is happening now and what you vividly imagine.",
      "一起激發的神經元會連接在一起。 Neurons that fire together, wire together.",
      "你的思維創創造了你的現實。 Your thoughts create your reality.",
      "打打破成為你自己的習慣，意味著邁入那個一直等待被允許出現的妳。 Breaking the habit of being yourself means stepping into the \"you\" that has been waiting to emerge.",
      "一起激發的神經元會連接在一起；重重複重複，直到它成為妳的預設模式。 Neurons that fire together, wire together; repeat and repeat until it becomes your default mode.",
      "關於身份認同與過去 (Identity & The Past)",
      "你無法在保持舊有身份的同時，去創造一個全新的未來。 You cannot create a brand-new future while holding onto your old identity.",
      "如果你一直做同一個人，你就會一直過同樣的生活。 If you keep being the same person, you will keep living the same life.",
      "你必须經歷一場活著時的死亡——讓過去那個「自我」死去。 You must experience a death while alive—letting that past \"self\" die.",
      "不要等到看到證據才相信，要相信了才會看到證據。 Don't wait until you see evidence to believe; believe, and then you will see evidence.",
      "你延遲的每一天，都是舊神經通路加強的另一天。 Every day you delay is another day those old neural pathways are strengthened.",
      "關於頻率、能量與顯化 (Frequency & Manifestation)",
      "宇宙不不回應你「想要」什麼，它回應你「正在成為」什麼。 The universe doesn't respond to what you \"want\"; it responds to who you are \"becoming.\"",
      "你播送的頻率，決定了妳吸引的現實。 The frequency you broadcast determines the reality you attract.",
      "要在祝福到來之前感到感激，要在金錢到來之前感到富有。 Feel grateful before the blessing arrives; feel wealthy before the money appears.",
      "感恩是終極的接收狀態。 Gratitude is the ultimate state of receivership.",
      "清晰的意圖加上提升的情感，就是顯化的強大公式。 Clear intention combined with elevated emotion is the powerful formula for manifestation.",
      "關於量子場與可能性 (Quantum Field & Possibilities)",
      "量子場不不關心你的過去，它只對你「現在」廣播的頻率做出反應。 The quantum field doesn't care about your past; it only responds to the frequency you are broadcasting now.",
      "所有的可能性都同時存在於場中，你的觀察決定了哪一個會坍縮成現實。 All possibilities exist simultaneously in the field; your observation determines which one collapses into reality.",
      "你不是環境的受害者，你始終是自己經驗的有意識創造者。 You are not a victim of your environment; you are always the conscious creator of your experience.",
      "不舒服不是失敗的跡象，不舒服是你正在穿越舊界限的證據。 Discomfort is not a sign of failure; discomfort is evidence you are crossing old boundaries.",

      "關於行動與結果 (Action & Results)",

      "不要只是慢慢地想改變，要用決心與強度讓轉變變得不可避免。 Don't just slowly want to change; use determination and intensity to make transformation inevitable.",
      "改進不是因為你走運，改進是因為你決定與內在的一致性保持聯結。 Improvement isn't because you are lucky; improvement is because you decided to stay connected to your inner coherence.",
      "你現在就在創造你的未來，通過你此刻選擇的思想。 You are creating your future right now, through the thoughts you choose in this moment.",
      "今天就做出決定，轉變就從這一刻自動發生。 Make the decision today; the transformation happens automatically from this moment.",
      "關於量子現實與觀察者 (Quantum Reality & The Observer)",
      "我們不是宇宙的被動旁觀者，而是現實的積極參與者。 We are not passive observers of the universe, but active participants in reality.",
      "觀察的行為本身，就會改變被觀察的對象。 The act of observation itself changes the object being observed.",
      "量子系統可以同時存在於多種狀態中，直到被觀察的那一刻。 A quantum system can exist in multiple states simultaneously until the moment of observation.",
      "當你改變觀察現實的方式時，你就在妳的物理世界中創造不同的結果。 When you change the way you observe reality, you create different results in your physical world.",
      "現實不不僅僅是妳所看到的，現實也是妳所創造的。 Reality is not just what you see; reality is also what you create.",
      "關於大腦與神經科學 (Brain & Neuroscience)",
      "一起激發的神經元會連接在一起。 Neurons that fire together, wire together.",
      "你的大腦不分辨「想像中的情景」與「現實中的情景」。 Your brain does not distinguish between an imagined scenario and a real-life scenario.",
      "重重複重複，直到新的思維模式成為妳的預設狀態。 Repeat and repeat until the new thinking pattern becomes your default state.",
      "你可以通過專注的練習，從字面上重新連接妳的大腦。 You can literally rewire your brain through focused practice.",
      "你的大腦不是固定的，妳的個性不是永久的。 Your brain is not fixed; your personality is not permanent.",
      "關於頻率與能量 (Frequency & Energy)",
      "宇宙中一切都以頻率在震動，一切都以能量在運作。 Everything in the universe vibrates in frequency; everything operates as energy.",
      "改變你的震動狀態，你就改變了妳所經歷的現實。 Change your vibrational state, and you change the reality you experience.",
      "思想是電荷，感覺是磁荷；它們共同創造了妳的電磁簽名。 Thought is the electrical charge, and feeling is the magnetic charge; together they create your electromagnetic signature.",
      "愛、喜悅與感恩是人類可及的最高頻率。 Love, joy, and gratitude are the highest frequencies accessible to humans.",
      "恐恐懼會讓能量收縮，愛會讓能量擴張。 Fear causes energy to contract; love causes energy to expand.",
      "關於顯化與意圖 (Manifestation & Intention)",
      "量子場不不回應你的願望，它回應你的「存在狀態」。 The quantum field doesn't respond to your wishes; it responds to your \"state of being.\"",
      "清晰的意圖加上提升的情感，就是顯化的強大公式。 Clear intention combined with elevated emotion is the powerful formula for manifestation.",
      "要在祝福到來之前感到感激，要在奇蹟發生之前感到喜悅。 Feel grateful before the blessing arrives; feel joyful before the miracle happens.",
      "你吸引的不是你想要的，你吸引的是你「是」的。 You don't attract what you want; you attract who you are.",
      "改進不是因為你走運，改進是因為你決定與內在的一致性保持聯結。 Improvement isn't because you are lucky; improvement is because you decided to stay connected to your inner coherence.",
      "關於身心一致性 (Mind-Body Coherence)",
      "你的情緒狀態實際上就是你的化學狀態。 Your emotional state is, in fact, your chemical state.",
      "當你的心與大腦同步時，你就創造了一個強大且有序的電子場。 When your heart and brain synchronize, you create a powerful and ordered electronic field.",
      "心臟產生的電磁場強度是大腦的 5000 倍。 The magnetic field produced by the heart is 5,000 times stronger than that of the brain.",
      "不舒服不是失敗的跡象，不舒服是你正在超越舊界限的證據。 Discomfort is not a sign of failure; discomfort is evidence you are crossing old boundaries.",
      "一致性（Coherence）就是將妳的思想、情感與行動對齊。 Coherence is aligning your thoughts, emotions, and actions.",
      "關於量子法則的實踐 (Practicing Quantum Laws)",
      "如果你想要發現宇宙的秘密，就要從能量、頻率和震動的角度去思考。 If you want to find the secrets of the universe, think in terms of energy, frequency, and vibration.",
      "你的未來正指望著你現在做出的選擇。 Your future is counting on the choices you make right now.",
      "打打破成為你自己的習慣，意味著釋放那個不再服務於妳成長的身分。 Breaking the habit of being yourself means releasing the identity that no longer serves your growth.",
      "沒有應用的知識只是娛樂，唯有實踐才能帶來轉變。 Knowledge without application is just entertainment; only practice brings transformation.",
      "力量不在於未來，力量始終存在於永恆的當下。 Power is not in the future; power always exists in the eternal now.",
      "🌀 關於打破等待與主動創造 (Breaking the Habit of Waiting & Active Creation)",
      "我們中許多人花了數年時間等待某件事或某個人來改變我們的生活；這樣的模式將我們困在一個永遠想要、卻不主動創造的狀態中。 Many of us spend years waiting for something or someone to change our lives; this pattern traps us in a state of constantly wanting, yet never actively creating.",
      "停止祈求，開始創造。如果你不再等待許可就能過上真正渴望的生活，會發生什麼？ Stop begging, start creating. What would happen if you no longer waited for permission to live the life you truly desire?",
      "事實是，轉變並非來自外部，而是始於你的內在；是通過專注的思想與持續的行動力量而實現。 The truth is, transformation does not come from the outside, but begins from your inside; it is realized through focused thought and sustained action.",
      "我是創造者，而不僅僅是夢想家。這將是你從被動渴望邁向主動創造的第一步。 I am a creator, not just a dreamer. This will be your first step from passive longing to active creation.",
      "真正區分創造者與夢想家之間的，並不是天賦、資源或運氣，而是他們與惰性的相處方式。 What truly separates the creator from the dreamer is not talent, resources, or luck, but how they deal with inertia.",
      "打破這種模式的關鍵在於意識到：行動並不需要先有動力，行動會創造動力。 The key to breaking this pattern is realizing that: action does not require motivation first; action creates motivation.",
      "在人們等待做好準備的過程中，無數機會每天都在流失。準備就緒其實是一種行動之後才會產生的感覺，而非採取行動的前提。 While people wait to get ready, countless opportunities slip away every day. Readiness is actually a feeling that arises after taking action, not a prerequisite for taking action.",
      "你一旦承諾要持續行動，就從人生的被動觀察者轉變為積極的創造者。 Once you commit to taking consistent action, you shift from a passive observer of life to an active creator.",
      "受害者視角把人生當成**「降臨在自己身上的事」，而創造者視角則把人生當成「通過自己而發生的事」**。 The victim perspective views life as \"things that happen to me,\" while the creator perspective views life as \"things that happen through me.\"",
      "🧠 關於神經可塑性與大腦編程 (Neuroplasticity & Brain Programming)",
      "每次你將注意力集中在一個特定目標或結果上，某些神經通路會得到強化；而因缺乏使用，其他通路則會自然削弱。 Every time you focus your attention on a specific goal or outcome, certain neural pathways are strengthened; while through lack of use, other pathways naturally weaken.",
      "你的意圖就像一道聚光燈，會照亮有助於目標達成的可能性，同時自然地弱化其他干擾。 Your intention is like a spotlight, illuminating the possibilities that help achieve your goals, while naturally dimming out other distractions.",
      "外部信息相同，卻能產生截然不同的感知與成效。你的心理狀態會觸發特定的荷爾蒙分泌和神經系統反應，直接影響能量水平、影響免疫功能、影響行動能力。 The external information is the same, yet it can produce completely different perceptions and results. Your mental state triggers specific hormonal secretions and nervous system responses, directly affecting your energy levels, affecting immune function, and affecting your ability to act.",
      "壓力性的念頭會激發交感神經系統，釋放抑制療癒、削弱免疫功能的皮質醇；而專注於可能性和感恩的念頭，則會啟動副交感神經系統，釋放促進再生和清晰思考的治癒激素。 Stressful thoughts trigger the sympathetic nervous system, releasing cortisol that suppresses healing and weakens immune function; while thoughts focused on possibility and gratitude activate the parasympathetic nervous system, releasing healing hormones that promote regeneration and clear thinking.",
      "與其讓外界刺激自動觸發你的反應，不如有意識地選擇能帶來建設性內在狀態的思想。 Rather than letting external stimuli automatically trigger your reaction, consciously choose thoughts that bring about a constructive internal state.",
      "你的大腦並不會區分生動想像的體驗和真實體驗。當你帶著情感投入去進行心理演練時，大腦會形成與實際經驗相似的神經連接。 Your brain does not distinguish between a vividly imagined experience and a real experience. When you emotionally invest in mental rehearsal, your brain forms neural connections similar to actual experience.",
      "你的想像力並非只能用於幻想，而是你所擁有的最強大的創造工具；它是所有在新現實落地前所誕生的工坊。 Your imagination is not just for fantasies, but is the most powerful tool of creation you possess; it is the workshop where every new reality is born before it lands.",
      "💖 關於心腦連貫與情緒能量 (Heart-Brain Coherence & Emotional Energy)",
      "多數人企圖僅靠理性思維來達成轉變，卻忽視了情感才是驅動顯化的能量系統。 Most people attempt to achieve transformation relying solely on rational thinking, ignoring that emotion is the energy system that drives manifestation.",
      "當你在腦海中保持清晰的圖景，同時用心去體驗更高層次的情感，你就營造了一個有利於轉變的內在環境。 When you hold a clear picture in your mind while simultaneously experiencing elevated emotions with your heart, you cultivate an internal environment primed for transformation.",
      "你不再等待外界出現好事才感覺良好，而是主動先產生正面情緒，從而吸引對應的體驗。 You no longer wait for good things to happen in the external world to feel good; instead, you proactively generate positive emotions first, thereby attracting corresponding experiences.",
      "很多誤以為勇氣是毫不畏懼，但其實兩者並不相同。毫不畏懼是沒有恐懼，而勇氣則是承認恐懼，但不被它支配。 Many mistakenly believe courage is fearlessness, but the two are not the same. Fearlessness is the absence of fear, while courage is acknowledging fear but not being dictated by it.",
      "多數人都等著先擁有自信才開始重要的行動，卻不明白實際過程正好相反：自信是行動之後的成果，而不是行動之前的先決條件。 Most people wait to have confidence before starting important actions, failing to understand that the actual process works exactly the opposite: confidence is the result of action, not the prerequisite before action.",
      "👁️ 關於覺察、信念與保護精神空間 (Awareness, Beliefs & Guarding Mental Space)",
      "在這個過程中，最具力量的頓悟之一在於：**信念並不是事實，而是一種選擇。**你可以選擇那些能讓你擴張而不是收縮的信念。 One of the most empowering epiphanies in this process is this: a belief is not a fact, but a choice. You can choose beliefs that allow you to expand rather than contract.",
      "當「我不夠好」這類想法出現時，要做的不是認同這個念頭，而是像觀察者一樣看著它。你不再成為那個念頭，而是能夠覺察那個念頭的意識。 When thoughts like \"I am not good enough\" arise, the goal is not to identify with the thought, but to watch it like an observer. You no longer become the thought, but the consciousness that can perceive the thought.",
      "這些信念並非你有意識地選擇而來，而是從童年經歷、文化信息、曾經的挫敗或對世界的誤解中慢慢形成的。 These beliefs were not consciously chosen by you, but slowly formed from childhood experiences, cultural messaging, past failures, or misunderstandings of the world.",
      "把你的精神空間想像成居家環境：你不會允許陌生人隨意闖進門，然而許多人卻對自己的心理空間放任自流，任由各種信息隨意進出。 Imagine your mental space as your home environment: you would not allow strangers to just barge in, yet many people leave their psychological space unguarded, letting any information enter at will.",
      "🙏 關於感恩與徹底承擔責任 (Gratitude & Extreme Ownership)",
      "只要你真心實意地去實踐，感恩能在一瞬間讓你從匱乏感跳到富足感，從專注於問題跳到專注於可能。 As long as you practice it genuinely, gratitude can shift you in an instant from a feeling of lack to a feeling of abundance, from focusing on problems to focusing on possibilities.",
      "如果你想讓感恩帶來更深層次的蛻變，試著去感恩那些尚未以物質形式出現、但已在你意識中存在的事物。好似它們已經到來一樣。 If you want gratitude to bring about deeper transformation, try to feel grateful for things that have not yet manifested physically but already exist in your consciousness. Act as if they have already arrived.",
      "承擔責任意味著承認：你的過去思維、你的情緒、你的信念和你的行為，共同創造了你現在所處的狀況。這不是在強調責怪，而是讓你看到自己擁有的創造力量。 Taking responsibility means acknowledging: your past thoughts, your emotions, your beliefs, and your behaviors have co-created your current situation. This is not about emphasizing blame, but showing you the creative power you possess.",
      "困難不再是投訴的理由，而是成長的契機；障礙不再是放棄的藉口，而是激發創造性問題解決的邀請。 Difficulties are no longer reasons to complain, but opportunities for growth; obstacles are no longer excuses to quit, but invitations to inspire creative problem-solving.",
      "你會繼續祈求改變，還是從今天開始主動創造？被動等待的時代已經過去，主動創造的時刻就在當下。 Will you continue to beg for change, or will you start actively creating from today? The era of passive waiting is over; the moment of active creation is right now.",
      "關於堅持與突破 (Persistence & Breakthrough)",
      "你並沒有被困住，你只是在積蓄力量。 You are not stuck; you are accumulating power.",
      "轉變不是一瞬之間發生的，而是一系列無形的變化持續累積的結果。 Transformation isn't something that happens in an instant; it's the result of a series of invisible changes accumulating continuously.",
      "每一次你選擇繼續前行，妳都在重塑妳的大腦。 Every time you choose to keep moving forward, you are rewiring your brain.",
      "堅持不不僅僅是咬牙撐過去，它是對妳願景的堅定信念。 Persistence is not just gritting your teeth to get through; it is a steadfast belief in your vision.",
      "突破往往發生在妳最想放棄的那一刻之後。 Breakthroughs often happen just after the moment you most want to give up.",
      "關於視覺化與大腦重塑 (Visualization & Brain Rewiring)",
      "你的大腦不分辨「想像中的經歷」與「現實中的經歷」。 Your brain does not distinguish between an imagined experience and a real-life experience.",
      "視覺化不不僅僅是做白日夢，它是妳現實的藍圖。 Visualization is not just daydreaming; it is the blueprint of your reality.",
      "一起激發的神經元會連接在一起；重複思考會強化這些連結。 Neurons that fire together, wire together; repeated thinking strengthens these connections.",
      "你不是在等待成功才感到喜悅，妳是透過喜悅來吸引成功。 You are not waiting for success to feel joy; you are attracting success through joy.",
      "生生動地想像你的未來，直到它感覺比妳的過去更真實。 Vividly imagine your future until it feels more real than your past.",
      "關於假設法則與信念 (Law of Assumption & Belief)",
      "你的假設是妳生活的無聲建築師。 Your assumptions are the silent architects of your life.",
      "不要等到看到證據才相信，要相信了才會看到證據。 Don't wait until you see evidence to believe; believe, and then you will see evidence.",

      "Drafting Quotes:",
      "當我們不斷重複某種思想或行為時，它會在腦中創造出一條神經通路；我們越多地使用這條通路，它就越強大，最終成為我們默認的操作模式。 (When we constantly repeat a thought or behavior, it creates a neural pathway in the brain; the more we use this pathway, the stronger it becomes, ultimately becoming our default operating mode.) - Parallelism",
      "如果我們能無意識地創造這些模式，想像一下，如果我們有意識地利用這種力量，我們可以實現什麼？ (If we can unconsciously create these patterns, imagine what we could achieve if we consciously utilized this power?) - Contrast",
      "如果你能重新連接大腦：使它自動尋找機會而非障礙，讓你在壓力下保持冷靜而不是焦慮，相信自己的潛力而不是懷疑自己。 (What if you could rewire your brain: to automatically look for opportunities rather than obstacles, to remain calm under pressure rather than anxious, to believe in your potential rather than doubt yourself.) - Parallelism / Contrast",
      "我們警覺和專注時大腦會產生 Beta 波，當我們放鬆時則會產生 Alpha 波，在深度睡眠時我們會經歷 Delta 波；掌握心靈的關鍵是學會在這些狀態之間自由切換。 (When we are alert and focused, the brain produces Beta waves; when we relax, it produces Alpha waves; during deep sleep, we experience Delta waves. The key to mastering the mind is learning to switch freely between these states.) - Parallelism",
      "當你冷靜和專注時，所有系統都運行順暢；但當壓力闖入時，就像一種病毒感染了你的心理軟件，擾亂了你的思維模式，使整個系統陷入混亂。 (When you are calm and focused, all systems run smoothly; but when stress intrudes, it is like a virus infecting your mental software, disrupting your thought patterns and throwing the entire system into chaos.) - Contrast",
      "短期壓力會使你的反應更敏銳、能量增加；但當壓力變成慢性時，你的大腦處於持續的高度警覺狀態，無法恢復到正常的平衡狀態。 (Short-term stress sharpens your reactions and increases your energy; but when stress becomes chronic, your brain remains in a constant state of high alert, unable to return to its normal state of balance.) - Contrast",
      "所有強烈的情緒，無論是積極的還是消極的，都能影響大腦的功能。關鍵是學會在這些情緒風暴中航行，而不讓它們傾覆你的心裡船隻。 (All strong emotions, whether positive or negative, can affect brain function. The key is learning to navigate through these emotional storms without letting them capsize your mental ship.) - Contrast",
      "通過練習對你的思想和感受的覺察而不加評判，你可以在刺激與反應之間創造一個緩衝；你可以選擇如何反應，而不是被情緒作用。 (By practicing non-judgmental awareness of your thoughts and feelings, you can create a buffer between stimulus and response; you can choose how to react, rather than being acted upon by emotions.) - Contrast",
      "我們的言語和思想遠不僅僅是短暫的心理體驗，它們是我們個人現實的建築師。 (Our words and thoughts are far more than just fleeting mental experiences; they are the architects of our personal reality.) - Contrast",
      "你說的每一個字，你滋養的每一個思想，都是種植在你潛意識中的種子。 (Every word you speak, every thought you nourish, is a seed planted in your subconscious.) - Parallelism",
      "當你不斷告訴自己「我做不到」時，你不僅僅是在表達一時的懷疑，你是在編程你的潛意識去尋找支持這一信念的證據。 (When you constantly tell yourself \"I can't do it,\" you are not just expressing a momentary doubt; you are programming your subconscious to find evidence to support this belief.) - Contrast",
      "當你有意識地選擇賦予力量的詞語和思想時，你就啟動了一個不同的循環；你會更有可能注意到機會，在遇到挫折時堅持下去。 (When you consciously choose empowering words and thoughts, you initiate a different cycle; you are more likely to notice opportunities and persevere through setbacks.)",

      "你有選擇你用詞和引導思想的力量。這是一種可以通過練習來培養的技能。 (You have the power to choose your words and guide your thoughts. This is a skill that can be cultivated through practice.)",

      "顯現並不是坐等事情神奇地出現；它是關於設定明確的意圖，保持積極的情緒狀態，然後採取靈感的行動來朝著你的目標前進。 (Manifestation is not sitting and waiting for things to magically appear; it is about setting clear intentions, maintaining a positive emotional state, and then taking inspired action to move toward your goals.) - Contrast",
      "結果執著會產生焦慮和懷疑，這些都是可能阻礙顯現過程的低震動情緒；相反，設定你的意圖，做工作，然後信任這個過程。 (Attachment to outcomes creates anxiety and doubt, which are low-vibration emotions that can block the manifestation process; instead, set your intentions, do the work, and then trust the process.) - Contrast",

      "這也就是為什麼注意你的情緒狀態如此重要：你的情緒不僅僅是對環境的反應，它們是你現實的積極創造者。 (This is why it is so important to pay attention to your emotional state: your emotions are not merely reactions to the environment; they are the active creators of your reality.) - Contrast",
      "顯現意味著你可以隨心所欲地得到你想要的東西，這是一個誤解；宇宙並不總是按我們所想的那樣交付，而是通常按我們成長和進化所需要的方式給予。 (It is a misconception that manifestation means you can get whatever you want whenever you want; the universe does not always deliver what we think we want, but usually gives us what we need to grow and evolve.) - Contrast",

      "通過練習對你的思想和感受的覺察而不加評判，你可以在刺激與反應之間創造一個緩衝；你可以選擇如何反應，而不是被情緒作用。 By practicing non-judgmental awareness of your thoughts and feelings, you can create a buffer between stimulus and response; you can choose how to react, rather than being acted upon by emotions.",
      "🗣️ 關於語言、思想與現實的創造 (Words, Thoughts, and Reality Creation)",
      "我們的言語和思想遠不僅僅是短暫的心理體驗，它們是我們個人現實的建築師。 Our words and thoughts are far more than just fleeting mental experiences; they are the architects of our personal reality.",
      "你說的每一個字，你滋養的每一個思想，都是種植在你潛意識中的種子。 Every word you speak, every thought you nourish, is a seed planted in your subconscious.",
      "當你不斷告訴自己「我做不到」時，你不僅僅是在表達一時的懷疑，你是在編程你的潛意識去尋找支持這一信念的證據。 When you constantly tell yourself \"I can't do it,\" you are not just expressing a momentary doubt; you are programming your subconscious to find evidence to support this belief.",
      "當你有意識地選擇賦予力量的詞語和思想時，你就啟動了一個不同的循環；你會更有可能注意到機會，在遇到挫折時堅持下去。 When you consciously choose empowering words and thoughts, you initiate a different cycle; you are more likely to notice opportunities and persevere when facing setbacks.",
      "你的詞語和思想是你感知和與周圍世界互動的濾鏡。這不是天真的積極性或否認現實，這是關於理解你的內心對話對外在世界的深遠影響。 Your words and thoughts are the filters through which you perceive and interact with the world around you. This is not naive positivity or denial of reality; it is about understanding the profound impact of your internal dialogue on the external world.",
      "你有選擇你用詞和引導思想的力量。這是一種可以通過練習來培養的技能。 You have the power to choose your words and guide your thoughts. This is a skill that can be cultivated through practice.",
      "我們假設為真的東西，會成為我們的現實。這不僅僅是心願思維，這是關於我們深深持有的信念對我們經驗的深遠影響。 What we assume to be true becomes our reality. This is not merely wishful thinking; this is about the profound impact our deeply held beliefs have on our experiences.",
      "肯定的關鍵在於它們的情感影響。機械地重複短語是不夠的，你需要感受到你所說的是真實的。 The key to affirmations lies in their emotional impact. Mechanically repeating phrases is not enough; you need to feel that what you are saying is true.",
      "肯定句並不是魔法咒語，它們在與一致的行動結合時效果最好。心理調節與實際行動的結合，可以真正帶來變革。 Affirmations are not magic spells; they work best when combined with aligned action. The combination of mental conditioning and practical action can truly bring about transformation.",
      "🌌 關於能量場與量子顯化 (Energy Fields & Quantum Manifestation)",
      "宇宙是一片巨大的能量海洋。我們不僅僅是在這片海洋中漂浮，我們是活躍的參與者，不斷地與周圍的能量互動並影響著它。 The universe is a vast ocean of energy. We are not merely floating in this ocean; we are active participants, constantly interacting with and influencing the energy around us.",
      "我們的思想、情感和行動就像這片海洋中的漣漪，發出震動，影響我們的環境，從而影響我們的現實。 Our thoughts, emotions, and actions are like ripples in this ocean, sending out vibrations that affect our environment and thereby affect our reality.",
      "當你處於積極、高能量狀態時，你更有可能吸引積極的體驗；相反，當你感到低落或消極時，你可能會發現自己遇到更多的障礙和困難。 When you are in a positive, high-energy state, you are more likely to attract positive experiences; conversely, when you feel low or negative, you may find yourself encountering more obstacles and difficulties.",
      "通過理解和利用能量，你不僅僅是在被動地體驗生活，你是在積極地共同創造你的現實。 By understanding and utilizing energy, you are not merely experiencing life passively; you are actively co-creating your reality.",
      "意圖不僅僅是一個轉瞬即逝的想法或一個模糊的願望，它是一種專注的願望與期望的結合。 An intention is not just a fleeting thought or a vague wish; it is a focused combination of desire and expectation.",
      "光有意圖是不夠的，它需要與提升的情感和一致的行動相結合；情緒在過程中如此重要，因為它們是你意圖的燃料。 Intention alone is not enough; it needs to be combined with elevated emotions and aligned actions. Emotions are so important in the process because they are the fuel for your intentions.",
      "你的大腦無法區分生動想像的體驗和真實體驗；所以可視化實際上可以開始重新連接你的神經通路。 Your brain cannot distinguish between a vividly imagined experience and a real experience; so visualization can actually begin to rewire your neural pathways.",
      "顯現並不是坐等事情神奇地出現；它是關於設定明確的意圖，保持積極的情緒狀態，然後採取靈感的行動來朝著你的目標前進。 Manifestation is not sitting and waiting for things to magically appear; it is about setting clear intentions, maintaining a positive emotional state, and then taking inspired action to move toward your goals.",
      "💖 關於情緒頻率與放手 (Emotional Frequencies & Letting Go)",
      "對結果的執著會產生焦慮和懷疑，這些都是可能阻礙顯現過程的低震動情緒；相反，設定你的意圖，做工作，然後信任這個過程。 Attachment to outcomes creates anxiety and doubt, which are low-vibration emotions that can block the manifestation process; instead, set your intentions, do the work, and then trust the process.",
      "每種情緒都有其獨特的震動頻率。像愛、喜悅和感激這樣的情緒在高頻率下震動，而恐懼、憤怒和抑鬱則有較低的頻率。 Every emotion has its own unique vibrational frequency. Emotions like love, joy, and gratitude vibrate at high frequencies, while fear, anger, and depression have lower frequencies.",
      "這也就是為什麼注意你的情緒狀態如此重要：你的情緒不僅僅是對環境的反應，它們是你現實的積極創造者。 This is why it is so important to pay attention to your emotional state: your emotions are not merely reactions to the environment; they are the active creators of your reality.",
      "顯現意味著你可以隨心所欲地得到你想要的東西，這是一個誤解；宇宙並不總是按我們所想的那樣交付，而是通常按我們成長和進化所需要的方式給予。 It is a misconception that manifestation means you can get whatever you want whenever you want; the universe does not always deliver what we think we want, but usually gives us what we need to grow and evolve.",
      "你不僅是環境的被動接受者，而是現實的積極創造者。通過有意識地管理你的能量並明智地選擇你的詞語，你有能力以深遠的方式塑造你的體驗。 You are not merely a passive recipient of your circumstances, but an active creator of your reality. By consciously managing your energy and choosing your words wisely, you have the power to shape your experience in profound ways.",
      "🧠 關於潛意識的編程與大腦機制 (Subconscious Programming & Brain Mechanics)",
      "這不是魔法，也不是騙局，而是一種強大的技術；這不是讓你耗盡心力或被成功犧牲，這是關於將你的意識意圖與潛意識的巨大力量對齊。 This is not magic, nor is it a scam, but a powerful technique; this is not about burning you out or sacrificing you for success, this is about aligning your conscious intention with the immense power of your subconscious.",
      "他們並沒有什麼超能力或異常的好運，他們只是發現了如何利用每個人內在的巨大力量。 They do not have superpowers or extraordinary good luck; they simply discovered how to utilize the immense power inherent within everyone.",
      "他們不一定比其他人更加努力，實際上他們往往看起來付出的努力更少，卻獲得了更大的成果。 They do not necessarily work harder than others; in fact, they often seem to put in less effort yet achieve greater results.",
      "他們以一種富足的心態來看待生活，而不是匱乏的心態；面對挑戰時，他們不是問「為什麼是我」，而是問「我能從中學到什麼」。 They view life with a mindset of abundance rather than a mindset of lack; when facing challenges, they do not ask \"why me,\" but rather ask \"what can I learn from this.\"",
      "不是突然之間這款車變多了，而是你的大腦已經被啟動，開始注意到它們。同理，當你訓練你的大腦去尋找機會時，你會發現它們無處不在。 It is not that the car suddenly multiplied, but that your brain was activated to start noticing them. Similarly, when you train your brain to look for opportunities, you will find them everywhere.",
      "吸引繁榮並不是坐等好事發生，這是關於將你的思想、信念和行動與你的渴望保持一致。 Attracting prosperity is not sitting around waiting for good things to happen; it is about aligning your thoughts, beliefs, and actions with your desires.",
      "從我們出生的那一刻起，我們的心智就像海綿一樣吸收著周圍的所有信息；這些信念塑造了我們的現實，影響著我們的人際關係和財務成功。 From the moment we are born, our minds absorb all surrounding information like a sponge; these beliefs shape our reality, influencing our relationships and financial success.",
      "這些想法不僅僅是偶爾閃過的念頭，它們是強大的編程，可能限制了你的潛力。 These thoughts are not merely fleeting ideas; they are powerful programming that can limit your potential.",
      "當你相信鬥爭是不可避免的，你會潛意識地尋找那些驗證這一信念的經歷；當你接受成功可以輕鬆自然地到來時，你就為自己打開了一個充滿可能性的世界。 When you believe that struggle is inevitable, you subconsciously look for experiences that validate this belief; when you accept that success can come easily and naturally, you open up a world of possibilities for yourself.",
      "這不是拒絕現實或假裝一切都完美無缺，而是關於你如何選擇解釋和回應生活中的事件；它是關於重新編程你的潛意識，讓它與你最深渴望和目標保持一致。 This is not denying reality or pretending everything is flawless, but about how you choose to interpret and respond to life's events; it is about reprogramming your subconscious to align with your deepest desires and goals.",
      "你的舊信念不是一夜之間形成的，新的信念也不會一蹴而就；但只要你堅持，你就能創造出支持你目標和夢想的全新神經通路。 Your old beliefs were not formed overnight, and new beliefs will not happen instantly either; but as long as you persist, you can create brand new neural pathways that support your goals and dreams.",
      "🌌 關於睡眠狀態與深層意識 (Sleep States & Deeper Consciousness)",
      "可見的冰山代表著你的意識思想...而在水面下隱藏著一個強大的力量：你的潛意識。這個隱藏的巨人驅動著你大多數的行為、信念，甚至是實現渴望的能力。 The visible iceberg represents your conscious thoughts... while beneath the surface hides a powerful force: your subconscious. This hidden giant drives the vast majority of your behaviors, beliefs, and even your ability to manifest your desires.",
      "你的潛意識無法區分什麼是真實的，與什麼是鮮明想像出來的。這就是為什麼頂級運動員會使用視覺化技術來提高他們的表現。 Your subconscious cannot distinguish between what is real and what is vividly imagined. This is why top athletes use visualization techniques to improve their performance.",
      "你不僅僅是在想，你是在編程。如果你多年來吸收了關於奮鬥和局限的觀念，你的潛意識就會忠實地將它們存檔為真理。 You are not merely thinking, you are programming. If you have absorbed concepts of struggle and limitation for years, your subconscious will faithfully file them away as truth.",
      "正如你訓練潛意識去開車一樣，你也可以訓練它接受新的、賦予力量的信念。 Just as you train your subconscious to drive a car, you can also train it to accept new, empowering beliefs.",
      "要創造持久的改變，我們需要將心理排練與高昂的情感相結合。 To create lasting change, we need to combine mental rehearsal with elevated emotion.",
      "睡眠不僅僅是休息的時間，它是身體恢復、心理處理，甚至是實現願望的關鍵時期。 Sleep is not just a time for rest; it is a crucial period for physical recovery, mental processing, and even the manifestation of desires.",
      "在睡眠期間，你的大腦並沒有完全關閉；相反，它進入了一個高度活躍的狀態，處理一天中的經歷、鞏固記憶，甚至解決問題。 During sleep, your brain does not shut down completely; instead, it enters a highly active state, processing the day's experiences, consolidating memories, and even solving problems.",
      "夢境一直被視為神祕和靈感的來源；在這種狀態下擺脫了清醒時的邏輯束縛，我們的心靈會更容易接受那些通常會忽視的可能性。 Dreams have always been seen as a source of mystery and inspiration; free from the logical constraints of wakefulness in this state, our minds become more receptive to possibilities we would normally ignore.",
      "意識和潛意識之間的屏障開始消融，為播種願望的種子創造了完美的條件。 The barrier between your conscious and subconscious minds begins to dissolve, creating perfect conditions for planting the seeds of your desires.",
      "🗣️ 關於「兩詞法則」與情緒驅動 (The Two-Word Technique & Emotional Drive)",
      "力量不在於詞語本身，而在於你如何使用它們，以及背後的意圖。 The power lies not in the words themselves, but in how you use them and the intention behind them.",
      "你只是在重複詞語，還是在真正感受這些詞語背後的情感？這種情感成分至關重要，你的潛意識對情感有著強烈的反應。 Are you merely repeating words, or truly feeling the emotions behind these words? This emotional component is crucial; your subconscious responds strongly to emotion.",
      "當你將你的「兩詞咒語」與真實積極的情感結合時，你就向潛意識傳遞了一個強大的信息：這是重要的，這是現實的，讓它發生吧。 When you combine your \"two-word mantra\" with authentic, positive emotion, you transmit a powerful message to your subconscious: this is important, this is real, make it happen.",
      "在入睡時繼續進行這個練習，讓這兩個詞成為你進入夢境之前最後的想法；你的潛意識將帶著這個意圖的種子整夜為你工作。 Continue this practice as you fall asleep, letting these two words be your final thoughts before entering the dreamscape; your subconscious will take this seed of intention and work on it for you throughout the night.",
      "當你醒來時，在睜開眼睛之前，再次重複你的兩個詞，感受與之相關的情感；以這種強大的意圖開始你的一天，讓它在你腦海中保持新鮮。 When you wake up, before opening your eyes, repeat your two words again and feel the associated emotions; start your day with this powerful intention and keep it fresh in your mind.",
      "✨ 關於視覺化與真正的顯化 (Visualization & True Manifestation)",
      "如果消極的想法可以塑造你的現實，那麼為什麼積極的、專注的意圖不能做到同樣的事情呢？ If negative thoughts can shape your reality, then why can't positive, focused intentions do the exact same thing?",
      "你不僅僅是在做白日夢，你是在給你的潛意識一個清晰的藍圖。 You are not merely daydreaming; you are giving your subconscious a clear blueprint.",
      "當你生動地想像自己實現目標，並將這種視覺化與真實的快樂、感恩和興奮感結合時，你正在向潛意識發送一個強烈的訊息：這是真的，這是可能的。 When you vividly imagine yourself achieving a goal, and combine this visualization with genuine joy, gratitude, and excitement, you are sending a powerful message to your subconscious: this is real, this is possible.",
      "顯現並不是坐等事情神奇地出現；它是關於設定明確的意圖，保持積極的情緒狀態，然後採取靈感的行動來朝著你的目標前進。 Manifestation is not sitting and waiting for things to magically appear; it is about setting clear intentions, maintaining a positive emotional state, and then taking inspired action to move toward your goals.",
      "這不是關於魔法般的思維或輕而易舉的成功；它是關於將你的意識願望與潛意識的無限潛力對齊，創造一種強大的協同作用。 This is not about magical thinking or effortless success; it is about aligning your conscious desires with the infinite potential of your subconscious, creating a powerful synergy.",
      "關於能量與頻率的本質 (Nature of Energy & Frequency)",
      "能量是我們宇宙中一切事物的基礎，也是我們現實的隱形藍圖。 Energy is the foundation of everything in our universe and the invisible blueprint of our reality.",
      "每一個思想、情緒和經歷都是一種能量，並在妳身上留下印記。 Every thought, emotion, and experience is a form of energy, leaving an imprint upon you.",
      "高頻震動與積極情感相關，低頻震動則與負面情緒相連。 High-frequency vibrations align with positive emotions; low-frequency vibrations connect to negative ones.",
      "你播送的頻率，決定了妳吸引的現實。 The frequency you broadcast determines the reality you attract.",
      "我們不僅僅是生活在能量中，我們本身就是能能量的表現形式。 We don’t just live in energy; we are the very expressions of energy.",
      "關於低頻能量的識別 (Identifying Low Frequency)",
      "低頻能量會侵蝕內心平靜，高頻能量會燃起生命激情。 Low-frequency energy erodes inner peace; high-frequency energy ignites life passion.",
      "情感上的疲憊不是身體的勞累，而是靈魂能量的耗盡。 Emotional exhaustion is not physical tiredness; it is the depletion of the soul's energy.",
      "能量吸血鬼可能偽裝成朋友，但每次互動後妳都會感到更糟。 Energy vampires may mask themselves as friends, but you feel worse after every interaction.",
      "負面思想就像心靈花園中的雜草，如果不加控制，它們會淹沒成長之花。 Negative thoughts are like weeds in the mind's garden; if left unchecked, they overwhelm the flowers of growth.",
      "感到脫節是能量下降的信號，它是靈魂在提示妳需要改變。 Feeling disconnected is a signal of dropping energy; it is the soul suggesting a need for change.",
      "關於大腦與神經重塑 (Brain & Neural Rewiring)",
      "你的大腦不分辨「外在現實」與「妳在腦海中生動想像的情景」。 Your brain does not distinguish between external reality and scenarios you vividly imagine.",
      "思想不是事實，思想只是妳在一段時間內形成的習慣模式。 Thoughts are not facts; thoughts are merely habitual patterns formed over time.",
      "一起激發的神經元會連接在一起；重重複重複，直到新頻率成為預設。 Neurons that fire together, wire together; repeat and repeat until the new frequency becomes the default.",
      "改變你的想法，你就改變了妳的化學反應；改變妳的化學反應，你就改變了妳的生命。 Change your thoughts, and you change your chemistry; change your chemistry, and you change your life.",
      "覺察是改變的第一步：你無法改變那些你沒有注意到的東西。 Awareness is the first step to change: you cannot change what you do not notice.",
      "關於能量保護與界限 (Energy Protection & Boundaries)",
      "正如你不會把家門敞開，也不要讓你的能量沒有防護。 Just as you wouldn't leave your house door wide open, don't leave your energy unprotected.",
      "設定明確的界限，是對自己能量最深層的自我照顧。 Setting clear boundaries is the deepest form of self-care for your energy.",
      "對於消耗你能量的事物說「不」，就是對妳自己的生命力說「是」。 Saying \"no\" to what drains you is saying \"yes\" to your own life force.",
      "想像一道明亮的保護光包圍著你，將任何停滯的能量推開。 Visualize a bright protective light surrounding you, pushing away any stagnant energy.",
      "環境會影響你的震動，整潔有序的空間允許能量自由流動。 Environment affects your vibration; a clean and organized space allows energy to flow freely.",
      "關於提升震動的實踐 (Practices to Raise Vibration)",
      "感恩是人類可及的最高頻率之一。 Gratitude is one of the highest frequencies accessible to humans.",
      "不要等到看到證據才感到感激，要先感到感激，以便奇蹟發生。 Don't wait for evidence to feel grateful; feel grateful first so that miracles happen.",
      "接接地氣（Grounding）是穩定的基礎，與地球連結能重置妳的電磁場。 Grounding is the basis of stability; connecting with Earth resets your electromagnetic field.",
      "身體是為運動而設計的，運動能釋放被卡住的能量模式。 The body is designed for movement; movement releases stuck energetic patterns.",
      "正念是每時每刻完全「在場」的藝術。 Mindfulness is the art of being fully \"present\" in every moment.",
      "關於營與靈魂滋養 (Nutrition & Soul Nourishment)",
      "你攝入的食物不僅為身體提供燃料，也影響妳的能量頻率。 The food you consume not only fuels your body but also affects your energetic frequency.",
      "新鮮的全食物帶有天然的高震動。 Fresh whole foods carry a naturally high vibration.",
      "正念飲食與吃什麼同樣重要：帶着感恩之心去享用每一口食物。 Mindful eating is as important as what you eat: enjoy every bite with gratitude.",
      "你的個人進進化，會為人類意識的集體提昇做出貢獻。 Your personal evolution contributes to the collective raising of human consciousness.",
      "你的能量是寶貴的，請明智地投資於那些能點燃妳內心的人與追求。 Your energy is precious; invest wisely in people and pursuits that ignite you from within.",
      "關於顯化的本質與力量 (Nature of Manifestation)",
      "你已經擁有了的力量，只需要被正確地引導。 You already possess the power; it only needs to be correctly guided.",
      "塑造你生活的力量，不是你需要追逐的東西，它一直都在你身邊。 The power to shape your life is not something you need to chase; it has always been by your side.",
      "這不是關於運氣或偶然，而是關於利用妳心智的隱藏潛力。 It's not about luck or coincidence, but about utilizing the hidden potential of your mind.",
      "顯化不僅僅是得到某物，它是關於成為妳命定要成為的那個人。 Manifestation is not just about getting something; it is about becoming the person you were meant to be.",
      "沒有應用的知識只是娛樂，唯有實踐才能帶來轉變。 Knowledge without application is just entertainment; only practice brings transformation.",
      "關於清晰度與意圖 (Clarity & Intention)",
      "清晰是將夢想變為現實的第一步。 Clarity is the first step toward turning dreams into reality.",
      "模糊的目標只會帶來模糊的結果，清晰就意味著力量。 Vague goals only bring vague results; clarity means power.",
      "你的大腦是一片肥沃的花園，思想就是妳播下的種子。 Your brain is a fertile garden; thoughts are the seeds you sow.",
      "不要根據你認為「可能」的事物來限制自己，要大膽地夢想。 Don't limit yourself based on what you think is \"possible\"; dream boldly.",
      "清晰不僅是關於「想要」什麼，更是關於「為什麼」想要它。 Clarity is not just about what you want, but why you want it.",
      "關於情感與視覺化 (Emotion & Visualization)",
      "思想是電荷，感覺是磁荷；它們共同創造了妳的電磁簽名。 Thought is the electrical charge, and feeling is the magnetic charge; together they create your electromagnetic signature.",
      "情緒就是能量在流動。 Emotion is energy in motion.",
      "你的大腦不分辨「真實經歷」與「生動想像的經歷」。 Your brain does not distinguish between a real experience and a vividly imagined one.",
      "視覺化不不僅僅是做白日夢，它是妳理理想現實的精精神排練。 Visualization is not just daydreaming; it is the mental rehearsal of your ideal reality.",
      "要在祝福到來之前感到感激，要在奇蹟發生之前感到喜悅。 Feel grateful before the blessing arrives; feel joyful before the miracle happens.",
      "關於詞彙一：肯定語 (Word 1: Affirmations)",
      "肯定語不是描述妳當前的現實，而是描述妳選選擇創造的現實。 Affirmations do not describe your current reality; they describe the reality you choose to create.",
      "肯定語總是要使用「現在時態」，彷彿妳想要的已經發生。 Affirmations should always be in the \"present tense,\" as if what you want is already happening.",
      "重重複是肯定語的關鍵：重重複重複，直到它成為妳的預設程序。 Repetition is the key to affirmations: repeat and repeat until it becomes your default program.",
      "肯定語是妳意圖的聲音，它重新編程了妳的潛意識。 Affirmations are the voice of your intention; they reprogram your subconscious.",
      "「我已經成功了」比「我將會成功」更有力量。 \"I have succeeded\" is more powerful than \"I will succeed.\"",
      "關於詞彙二：感恩 (Word 2: Gratitude)",
      "感恩是終極的接收狀態。 Gratitude is the ultimate state of receivership.",
      "感恩將你的注意力從「缺失」轉移到「豐盛」。 Gratitude shifts your attention from \"lack\" to \"abundance.\"",
      "感恩是你可以體驗到的最高震動狀態之一。 Gratitude is one of the highest vibrational states you can experience.",
      "宇宙會給你更多你「欣賞」的東西。 The universe gives you more of what you appreciate.",
      "在祝福顯現之前就先表達感謝，這就是顯化的秘訣。 Expressing thanks before the blessing manifests is the secret of manifestation.",
      "關於行動、放下與未來 (Action, Letting Go & Future)",
      "靈靈感行動感覺毫不費力，它會讓你感到充充滿能量而非耗盡。 Inspired action feels effortless; it leaves you feeling energized rather than drained.",
      "不要強求結果，要信信任過程。 Do not force outcomes; trust the process.",
      "放下執念不不意味著放棄夢想，而是釋放妳對結果的情感負擔。 Letting go doesn't mean giving up on dreams; it means releasing the emotional burden of the outcome.",
      "你現在就在創造你的未來，通過你此刻選擇的頻率。 You are creating your future right now, through the frequency you choose in this moment.",
      "今天就做出決定，轉變就從這一刻自動發生。 Make the decision today; the transformation happens automatically from this moment.",
      "🌀 關於覺醒的開端與人際關係的改變 (The Onset of Awakening & Shifting Relationships)",
      "有一天你還在按照慣常的節奏過日子，下一天你卻發現自己開始質疑曾經深信不疑的一切。 One day you are living life at your usual pace, and the next day you find yourself questioning everything you once deeply believed.",
      "曾經讓你興奮的談話現在變得空洞，也許你發現越來越難與老朋友甚至家人產生共鳴。這並不是說你不再關心他們，而是你的內心世界開始以一種難以言喻的方式發展。 Conversations that once excited you now feel empty, and perhaps you find it increasingly difficult to resonate with old friends or even family. This is not to say you no longer care about them, but rather your inner world is beginning to evolve in an indescribable way.",
      "這種孤獨感儘管讓人不適，其實是成長的標誌：它表明你在擴展自己的意識，並通過新的視角看待世界。 This sense of loneliness, though uncomfortable, is actually a sign of growth: it indicates that you are expanding your consciousness and seeing the world through a new perspective.",
      "那些曾經看似重要的事情失去了意義，而你曾經忽略的突然變得至關重要。 Things that once seemed important have lost their meaning, while things you once ignored have suddenly become crucial.",
      "這種人際關係的變化並不是要變得比別人更好或拋棄某些人；相反，這是在尋求能滋養你進化中的精神的連接。 This shift in relationships is not about becoming better than others or abandoning certain people; instead, it is about seeking connections that nourish your evolving spirit.",
      "有些人出現在你的人生中是為了一個理由，一個季節，或一輩子。 Some people come into your life for a reason, a season, or a lifetime.",
      "覺醒並不是一個線性過程：有時候你會感到與新的視角緊密聯繫，而有些時候你可能懷念舊生活的簡單。 Awakening is not a linear process: sometimes you will feel deeply connected to a new perspective, while at other times you might long for the simplicity of your old life.",
      "人際關係的變化是關於將外部世界與內在的成長相一致；它是為那些支持和滋養你進化自我的關係騰出空間，同時學會以新的眼光看待世界。 Changes in relationships are about aligning the external world with your internal growth; it is about making space for relationships that support and nourish your evolving self, while learning to see the world with new eyes.",
      "🌌 關於孤獨感與內在空間 (Loneliness & Inner Space)",
      "這種獨特的孤獨感不是源於身體上的隔離，而是源於對自己不斷變化的覺知。 This unique sense of loneliness does not stem from physical isolation, but rather from an awareness of your own continuous change.",
      "這是一種深刻的感覺：感覺自己從根本上與眾不同，感覺自己不再像以前那樣融入世界，就像你走上了一條不同的道路。 It is a profound feeling: feeling fundamentally different, feeling like you no longer fit into the world as you once did, as if you have stepped onto a different path.",
      "這條路與社會主流平行，但卻分離。 This path runs parallel to the mainstream of society, yet is separate from it.",
      "這種孤獨感儘管具有挑戰性，卻是覺醒過程中的自然且必要的一部分；它為深度自省和成長提供了空間。 This sense of loneliness, though challenging, is a natural and necessary part of the awakening process; it provides the space for deep self-reflection and growth.",
      "正如毛毛蟲必須在繭中隔離自己以變成蝴蝶一樣，你也需要這一看似隔離的時期來完成全面的轉變。 Just as a caterpillar must isolate itself in a cocoon to become a butterfly, you too need this seemingly isolated period to complete a total transformation.",
      "孤立感和與他人的疏離感，並不是一個需要解決的問題，而是一種邀請，讓我們更深入地進入自己的內心世界。 Feelings of isolation and alienation from others are not a problem to be solved, but an invitation allowing us to enter more deeply into our own inner world.",
      "👁️ 關於感官敏銳與同理心的擴展 (Heightened Sensitivity & Empathy)",
      "顏色變得更加鮮豔，聲音更加響亮，情感更加明顯，彷彿有人將生命的音量調大了。 Colors become more vibrant, sounds louder, and emotions more pronounced, as if someone has turned up the volume on life.",
      "這不是逃避世界，而是尋找一種尊重我們擴展的敏感度的新方式來與世界互動。 This is not escaping the world, but finding a new way to interact with the world that honors our expanded sensitivity.",
      "隨著時間的推移，那些曾經讓人不知所措的感覺，往往會成為深刻洞察和聯繫的來源；最初看似負擔的敏感度，最終可以成為以更大覺知和慈悲心引導生活的強大工具。 Over time, feelings that once seemed overwhelming often become sources of profound insight and connection; a sensitivity that initially appeared as a burden can ultimately become a powerful tool to guide life with greater awareness and compassion.",
      "街上的陌生人不再只是人群中的一個面孔，而是一個有著自己掙扎與快樂的同類；窗外的樹木也不再只是風景，它們是與我們共享這個世界的有生命的存在。 Strangers on the street are no longer just faces in a crowd, but fellow human beings with their own struggles and joys; trees outside the window are no longer just scenery, they are living beings sharing this world with us.",
      "別人的福祉變得與自己的同樣重要。這不是關於殉道或自我犧牲，而是對你的福祉與所有人的福祉本質上相互關聯的真正認識。 The well-being of others becomes just as important as your own. This is not about martyrdom or self-sacrifice, but a genuine realization that your well-being is intrinsically connected to the well-being of all.",
      "🧭 關於追尋真實與生命目的 (Authenticity & Finding Purpose)",
      "對真實體驗和更深層次理解的渴望是精神成長的標誌。這種探索通常從質疑開始：質疑我們的信仰、質疑習慣、質疑人際關係，甚至質疑我們自己的身份。 The longing for authentic experiences and deeper understanding is a hallmark of spiritual growth. This exploration typically begins with questioning: questioning our beliefs, questioning habits, questioning relationships, and even questioning our very identity.",
      "那些曾經顯得重要的事情——職業發展、物質財富、社會地位——可能突然變得空洞或毫無意義；相反，我們開始被那些真實且與我們不斷進化的自我一致的經歷和追求所吸引。 Things that once seemed important—career advancement, material wealth, social status—might suddenly become empty or meaningless; instead, we find ourselves drawn to experiences and pursuits that are authentic and aligned with our evolving selves.",
      "我們可能意識到自己一直在按照別人的期望生活，而非遵循自己真正的願望。 We may realize that we have been living according to the expectations of others, rather than following our own true desires.",
      "你早上醒來突然發現，那些曾經驅動你的目標變得空洞了：你一直追逐的晉升機會不再讓你感到興奮，你一直在存錢購買的物質財產失去了吸引力。 You wake up one morning and suddenly find that the goals that once drove you have become empty: the promotion you've been chasing no longer excites you, and the material possessions you've been saving for have lost their appeal.",
      "這種轉變是關於讓你的生活與最深層的價值觀和激情相一致；這是一種意識到，之前的目標可能更多是由社會期望或外部壓力所塑造，而非出自你的真實自我。 This shift is about aligning your life with your deepest values and passions; it is a realization that your previous goals may have been shaped more by societal expectations or external pressures, rather than springing from your true self.",
      "這種目的感的出現既令人振奮，又讓人畏懼。一方面，它能讓你感受到前所未有的清晰感和方向感；另一方面，它可能要求你在生活中做出重大的改變。 The emergence of this sense of purpose is both exhilarating and daunting. On one hand, it gives you an unprecedented sense of clarity and direction; on the other hand, it may require you to make significant changes in your life.",
      "擁抱這種新的目的感，往往意味著要走出舒適區，冒險面對未知；這可能意味著放棄一份穩定的工作去追求你的激情，或是在面對不公時發聲。 Embracing this new sense of purpose often means stepping out of your comfort zone and risking the unknown; it might mean leaving a stable job to pursue your passion, or speaking out in the face of injustice.",
      "目的不是你一次性發現的東西，而是隨著你的精神旅程不斷進化和深化的過程。關鍵是保持開放、好奇，並願意追隨你的覺醒所指引的方向。 Purpose is not something you discover all at once, but a process that continuously evolves and deepens along your spiritual journey. The key is to remain open, curious, and willing to follow the direction your awakening guides you.",
      "🧠 關於將知識化為現實 (Embodiment & Creating the New Reality)",
      "這種意識的擴展不僅僅是一個比喻的概念，而是我們大腦神經網絡發生的實實在在的變化；當我們對新的體驗和思維方式敞開時，我們實際上是在創造新的突觸連接。 This expansion of consciousness is not just a metaphorical concept, but an actual, physical change in our brain's neural networks; when we open ourselves up to new experiences and ways of thinking, we are literally creating new synaptic connections.",
      "學習者和轉變者之間的區別，與智力或獲取信息的途徑無關，而在於是否願意超越智力上的理解進入到具身中。 The difference between a learner and a transformer has nothing to do with intellect or access to information, but rather the willingness to move beyond intellectual understanding into physical embodiment.",
      "大多數人把轉變的知識當作娛樂：他們收集見解，感受到暫時的鼓舞，然後回到他們熟悉的模式，而從不實施他們所學到的東西。 Most people treat transformational knowledge as entertainment: they collect insights, feel temporarily inspired, and then return to their familiar patterns, never implementing what they have learned.",
