    let currentPage = 1;
    const cardsPerPage = 20;
    let filteredData = [...paradigmData];
    let currentRange = 'all';

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      if (filteredData.length === 0) {
        container.innerHTML = '<div class="empty-state">未找到結果 | No results found</div>';
        document.getElementById('paginationContainer').innerHTML = '';
        return;
      }

      const start = (currentPage - 1) * cardsPerPage;
      const end = Math.min(start + cardsPerPage, filteredData.length);
      const pageData = filteredData.slice(start, end);

      pageData.forEach((item) => {
        const card = createCard(item);
        container.appendChild(card);
      });

      renderPagination();
      updateStats();
    }

    function createCard(item) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-header">
          <span class="card-id">#${item.id}</span>
          <span class="card-title">${item.legacy}</span>
          <span class="card-toggle">▼</span>
        </div>
        <div class="card-content">
          <div class="card-body">
            <div class="paradigm-section legacy">
              <div class="section-label legacy">
                <span>舊模型 LEGACY</span>
                <button class="tts-btn" onclick="speakEnglish('${item.legacy_en.replace(/'/g, "\\'")}')">🔊</button>
              </div>
              <div class="paradigm-text">${item.legacy}</div>
              <div class="paradigm-en">${item.legacy_en}</div>
            </div>
            <div class="paradigm-section upgrade">
              <div class="section-label upgrade">
                <span>更新模型 UPGRADE</span>
                <button class="tts-btn" onclick="speakEnglish('${item.upgrade_en.replace(/'/g, "\\'")}')">🔊</button>
              </div>
              <div class="paradigm-text">${item.upgrade}</div>
              <div class="paradigm-en">${item.upgrade_en}</div>
            </div>
          </div>
        </div>
      `;

      card.querySelector('.card-header').addEventListener('click', () => {
        card.classList.toggle('expanded');
      });

      return card;
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredData.length / cardsPerPage);
      const paginationContainer = document.getElementById('paginationContainer');
      paginationContainer.innerHTML = '';

      if (totalPages <= 1) return;

      for (let i = 1; i <= Math.min(totalPages, 10); i++) {
        const btn = document.createElement('button');
        btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        btn.textContent = i;
        btn.onclick = () => {
          currentPage = i;
          renderCards();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        paginationContainer.appendChild(btn);
      }

      if (totalPages > 10) {
        const span = document.createElement('span');
        span.textContent = `... ${totalPages}`;
        span.style.padding = '8px 12px';
        paginationContainer.appendChild(span);
      }
    }

    function updateStats() {
      const total = filteredData.length;
      const statsText = document.getElementById('statsText');
      if (currentRange === 'all') {
        statsText.textContent = `顯示 ${total} 筆記錄 | Showing ${total} records`;
      } else {
        statsText.textContent = `範圍 ${currentRange}: ${total} 筆 | Range ${currentRange}: ${total} records`;
      }
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      currentPage = 1;

      if (!query) {
        filterByRange(currentRange);
        return;
      }

      filteredData = paradigmData.filter(item => 
        item.legacy.toLowerCase().includes(query) ||
        item.legacy_en.toLowerCase().includes(query) ||
        item.upgrade.toLowerCase().includes(query) ||
        item.upgrade_en.toLowerCase().includes(query) ||
        item.id.toString() === query
      );

      renderCards();
    }

    function filterByRange(range) {
      currentRange = range;
      currentPage = 1;

      // Update active button
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');

      if (range === 'all') {
        filteredData = [...paradigmData];
      } else {
        const [start, end] = range.split('-').map(Number);
        filteredData = paradigmData.filter(item => item.id >= start && item.id <= end);
      }

      renderCards();
    }

    function speakEnglish(text) {
      // Cancel any ongoing speech
      speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      utterance.pitch = 1;
      utterance.volume = 1;

      // Add visual feedback
      const btn = event.target;
      btn.classList.add('playing');
      
      utterance.onend = () => {
        btn.classList.remove('playing');
      };

      speechSynthesis.speak(utterance);
    }

    // Initialize
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleSearch();
      }
    });

    renderCards();
  </script>
